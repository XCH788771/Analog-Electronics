        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "TNR-Embed", "Times New Roman", SimHei, sans-serif, "PingFang SC";
    }
    /* 16:9 舞台，深绿背景 */
    .stage {
        aspect-ratio: 16 / 9;
        width: min(100vw, calc(100vh * 16 / 9));
        background: #0a3d20;
        position: relative;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }
    svg.circuit { width: 100%; height: 100%; display: block; }
    /* 英文字符/数字一律 Times New Roman，中文回落雅黑；!important 防任何覆盖 */
    svg.circuit, svg.circuit text, .anno { font-family: "TNR-Embed", "Times New Roman", SimHei, sans-serif !important; }

    /* ===== 可交互单元通用样式（元件 / 导线） ===== */
    .interactive { cursor: pointer; }
    .interactive:hover .hot { stroke: #ffe66d; filter: drop-shadow(0 0 6px rgba(255, 230, 109, 0.9)); }
    .interactive:hover .hot-fill { fill: rgba(255, 230, 109, 0.15); }
    .interactive:hover .hot-label { fill: #ffe66d; }
    /* fill=none 的矩形元件（电阻框等）内部也响应鼠标：默认 visiblePainted 只认边框，框中间是悬停/点击死区 */
    .interactive rect[fill="none"] { pointer-events: all; }
    .flash { animation: flashAnno 0.5s ease; }
    @keyframes flashAnno {
        0% { filter: drop-shadow(0 0 2px rgba(126, 247, 176, 0.4)); }
        50% { filter: drop-shadow(0 0 12px rgba(126, 247, 176, 1)); }
        100% { filter: drop-shadow(0 0 2px rgba(126, 247, 176, 0.4)); }
    }

    /* ===== 关闭 / 返回按钮（右上角，关闭在右、返回在左） ===== */
    .close-btn, .back-btn {
        position: absolute;
        top: 2.6%;
        width: 4.2%;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.55);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 2.2vmin;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s ease;
        z-index: 10;
    }
    .close-btn { right: 1.6%; }
    .back-btn  { right: 6.6%; }
    .close-btn:hover {
        background: #e74c3c;
        border-color: #e74c3c;
        transform: rotate(90deg);
    }
    .back-btn:hover {
        background: #3498db;
        border-color: #3498db;
        transform: translateX(-3px);
    }

    /* ===== 交互注解气泡 ===== */
    .anno {
        position: absolute;
        display: none;
        max-width: 340px;
        background: #ffffff;
        color: #123c26;
        padding: 10px 14px;
        border-radius: 8px;
        border-left: 4px solid #f1c40f;
        font-size: 15px;
        line-height: 1.55;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        z-index: 20;
        pointer-events: none;
    }

    /* ===== 演示动画 ===== */
    /* R3 平衡电阻：变黄闪烁3次后隐去（等效短路线） */
    @keyframes r3Blink {
        0%, 100% { stroke: #ffe66d; filter: drop-shadow(0 0 8px rgba(255, 230, 109, 0.9)); }
        50%      { stroke: #ffffff; filter: none; }
    }
    .r3-blink .hot { animation: r3Blink 0.22s ease 3; }
    .r3-shorted .hot { visibility: hidden; }
    /* 运放同相端 + 号：变红闪烁3次后保持红色 */
    @keyframes plusBlink {
        0%, 100% { fill: #ff5252; }
        50%      { fill: #ffe66d; }
    }
    #plus-sign.plus-blink { animation: plusBlink 0.22s ease 3; fill: #ff5252; }
    #plus-sign.plus-red { fill: #ff5252; }
    /* 计算演示：R1/R2 串联时变紫闪烁3次后保持紫色 */
    @keyframes resPurpleBlink {
        0%, 100% { stroke: #b266ff; }
        50%      { stroke: #ffffff; }
    }
    g.res-purple rect.hot { stroke: #b266ff; animation: resPurpleBlink 0.22s ease 3; }
    g.res-purple text { fill: #b266ff; }
    /* 计算演示：电位参考（地/R1上节点/输出节点）变绿闪烁3次后保持绿色 */
    @keyframes greenBlink {
        0%, 100% { stroke: #4caf50; }
        50%      { stroke: #ffffff; }
    }
    g.green-flash .hot { stroke: #4caf50; animation: greenBlink 0.22s ease 3; }
    /* Ri 演示：运放开路等效时整体隐藏（含 A 字） */
    .opamp-hidden .hot, .opamp-hidden text { visibility: hidden; }
    /* Ri 演示：信号源隐藏（仅保留 Vᵢ 文字标注） */
    .src-hidden *:not(text) { visibility: hidden; }
    /* Ro 演示：Vᵢ 文字也隐藏（输入端口直接接地） */
    .src-text-hidden text { visibility: hidden; }

    /* ===== 红字操作提示（关闭按钮旁） ===== */
    .hint-label {
        position: absolute;
        top: 3.4%;
        right: 12%;
        color: #ff5252;
        font-size: 2.2vmin;
        font-weight: bold;
        letter-spacing: 1px;
        z-index: 10;
        pointer-events: none;
    }

    /* ===== 计算过程演示 ===== */
    .calc-step text, text.calc-step { font-size: 46px; }
    .calc-step tspan.sub, tspan.sub { font-size: 100%; baseline-shift: -20%; }
    @keyframes stepIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .calc-step { animation: stepIn 0.5s ease; }
    /* ===== 参数分段按钮（Av/Ri/Ro，点击触发对应计算段） ===== */
    .calc-btn { cursor: pointer; }
    .calc-btn rect {
        fill: rgba(255,255,255,0.10);
        stroke: rgba(255,255,255,0.55);
        stroke-width: 2;
        transition: all 0.2s ease;
    }
    .calc-btn text { fill: #ffffff; }
    .calc-btn:hover rect { fill: rgba(255,255,255,0.22); stroke: #ffffff; }
    .calc-btn.active rect { fill: rgba(255,230,109,0.18); stroke: #ffe66d; }
    .calc-btn.active text { fill: #ffe66d; }
</style>
</head>

<script>
    // ===== 交互讲解：悬停注解 + 分句语音（可同步演示动画） =====
    const stage = document.querySelector('.stage');
    const anno = document.getElementById('anno');
    // 字体兜底：启动时给全部 SVG 元素（含 tspan）内联写入字体，优先级最高、任何环境都生效
    document.querySelectorAll('svg.circuit, svg.circuit *').forEach(el => {
        el.style.fontFamily = '"TNR-Embed", "Times New Roman", SimHei, sans-serif';
    });
    const plusSign = document.getElementById('plus-sign');
    const r3Short = document.getElementById('r3-short');
    const r3Group = document.querySelector('[data-id="comp-r3"]');
    let demoTimer = null;
    let seqId = 0;   // 语音序列令牌：移开元件 / 关闭时作废未播完的句子

    // 注解与语音内容（data-id → 文字注解 / 分句语音稿，onStart 在该句开口时触发演示）
    const ANNOS = {
        'comp-r3': {
            text: '平衡电阻 R₃ = R₁∥R₂',
            parts: [
                { text: '平衡电阻R3，保证两个输入端的对地直流电阻相等。' },

        'comp-r1': { text: '接地电阻', parts: [{ text: 'R1为接地电阻，与反馈电阻组成负反馈分压网络。' }] },
        'comp-r2': { text: '反馈电阻', parts: [{ text: 'R2为反馈电阻，与R1组成负反馈分压网络。' }] },
        'comp-v1': {
            text: '信号源 Vᵢ：从同相端输入，故为同相放大',
            parts: [
                { text: '输入信号源。' },
                { text: '从同向端输入，故称之为同向放大。', onStart: () => plusSign.classList.add('plus-blink', 'plus-red') }
            ]
        },
        'comp-opamp': {
            text: '集成运算放大器 A',
            parts: [{ text: '集成运放，工作在线性区时，满足虚短和虚断，这是分析运算电路的基础。' }]
        },

            text: '反相输入端',
            parts: [{ text: '反向输入端，所有线性运算放大电路的反馈电阻，都是接到反向输入端。' }]
        },
        'comp-input-pos': { text: '同相输入端', parts: [{ text: '同向输入端。' }] },
        'comp-output': {
            text: '输出电压 Vₒ = (1 + R₂/R₁)·Vᵢ',
            parts: [{ text: '输出电压，等于1加R2比R1，再乘以输入信号。' }]
        },
        'comp-gnd-src': { text: '接地：电位参考点', parts: [{ text: '接地，是电路电位的参考点。' }] },
        'comp-gnd-r1': { text: '接地：电位参考点', parts: [{ text: '接地，是电路电位的参考点。' }] },

        'wire-1': { text: '输入信号通路', parts: [{ text: '输入信号，经平衡电阻R3，加到运放的同向输入端。' }] },
        'wire-2': { text: '输入信号通路', parts: [{ text: '信号加到同向输入端，所以是同向放大。' }] },
        'wire-3': { text: '信号源接地回路', parts: [{ text: '信号源的接地回路。' }] },
        'wire-6': { text: '反相输入端引线', parts: [{ text: '反向输入端引线。由虚断可知，该端没有电流流入运放。' }] },
        'wire-7': { text: 'R₁ 支路导线', parts: [{ text: 'R1支路导线，与R2共同构成负反馈分压网络。' }] },
        'wire-8': { text: 'R₁ 接地导线', parts: [{ text: 'R1的接地导线。' }] },
        'wire-9': { text: '反馈连接线', parts: [{ text: '反馈连接线，把反相输入端与R3左端连成同一节点。' }] },
        'wire-10': { text: '反馈通路', parts: [{ text: '反馈通路，输出电压经R2和该导线反馈回反向端，形成负反馈。' }] },
        'wire-11': { text: '输出导线', parts: [{ text: '输出导线，把输出电压引出电路。' }] }
    };

    function showAnno(e, html) { anno.innerHTML = html; anno.style.display = 'block'; moveAnno(e); }
    function moveAnno(e) {
        const r = stage.getBoundingClientRect();
        let x = e.clientX - r.left + 16;
        let y = e.clientY - r.top - anno.offsetHeight - 14;   // 默认：光标右上方
        if (y < 8) y = 8;
        if (x + anno.offsetWidth > r.width - 10) {            // 右侧放不下 → 左上方
            x = e.clientX - r.left - anno.offsetWidth - 16;
        }
        anno.style.left = x + 'px';
        anno.style.top = y + 'px';
    }
    function hideAnno() { anno.style.display = 'none'; }

    // 语音讲解：逐句播放，onStart 与该句开口同步；onDone 在整段播完时触发
    // 无 TTS 环境时按字数估算节奏推进，演示动画照常进行
    try { speechSynthesis.getVoices(); } catch (e) {}
    function speakSeq(parts, onDone) {
        const my = ++seqId;
        let i = 0;
        const next = () => {
            if (my !== seqId) return;
            if (i >= parts.length) { if (onDone) onDone(); return; }
            const p = parts[i++];
            if (p.onStart) p.onStart();
            try {
                if (!window.speechSynthesis) {
                    setTimeout(() => { if (my === seqId) next(); }, Math.max(1200, p.text.length * 200));
                    return;
                }
                const u = new SpeechSynthesisUtterance(p.text);
                u.lang = 'zh-CN';
                const zh = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().indexOf('zh') === 0);
                if (zh) u.voice = zh;
                let done = false;
                const adv = () => { if (!done) { done = true; next(); } };
                u.onend = adv;
                u.onerror = adv;
                speechSynthesis.speak(u);
            } catch (e) {}
        };
        next();
    }
    function stopSpeak() { seqId++; try { speechSynthesis && speechSynthesis.cancel(); } catch (e) {} }

    // R3 平衡电阻演示：变黄闪烁3次 → 隐去电阻、显示短路线
    function startR3Demo(g) {
        g.classList.add('r3-blink');
        demoTimer = setTimeout(() => {
            g.classList.remove('r3-blink');
            g.classList.add('r3-shorted');
            r3Short.style.visibility = 'visible';
        }, 720);
    }
    function stopR3Demo(g) {
        clearTimeout(demoTimer);
        g.classList.remove('r3-blink', 'r3-shorted');
        r3Short.style.visibility = 'hidden';
    }

    // 箭头擦除显示动画：路径从起点（下端）向上再拐描画，完成后显示箭头与标注
    function wipeArrow(g) {
        showEl(g);
        const p = g.querySelector('path');
        const len = p.getTotalLength();
        p.style.transition = 'none';
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
        void p.getBoundingClientRect();
        p.style.transition = 'stroke-dashoffset 0.6s ease-out';
        p.style.strokeDashoffset = '0';
        const head = g.querySelector('polygon'), label = g.querySelector('text');
        head.style.opacity = '0'; label.style.opacity = '0';
        addT(() => { head.style.opacity = '1'; label.style.opacity = '1'; }, 620);
    }

    // ===== 计算过程分步演示（Av/Ri/Ro 参数按钮触发） =====
    const calcIds = ['calc-vp', 'calc-ip', 'calc-vn', 'calc-in', 'calc-i1', 'calc-i2', 'calc-node-r1', 'calc-node-out', 'calc-ri-box', 'calc-ri-arrow', 'calc-ro-arrow', 'calc-ri-ellipse', 'calc-ro-gnd'];
    const srcParts = ['comp-v1', 'wire-1', 'wire-3', 'comp-gnd-src'];   // Ri 演示时隐藏（仅留 Vᵢ 文字）
    const stepsGroup = document.getElementById('calc-steps');
    const opampGroup = document.querySelector('g[data-id="comp-opamp"]');
    let calcTimers = [], calcIvs = [], calcRunning = false, calcStepY = 330;
    let calcSpeaking = false;   // 计算演示语音播放中：悬停元件仅显示注解，不打断演示声画

    function addT(fn, ms) { calcTimers.push(setTimeout(fn, ms)); }
    function showEl(g) { g.style.visibility = 'visible'; g.style.opacity = '1'; }
    function blinkEl(el, times, dur) {
        let n = 0;
        showEl(el);
        const iv = setInterval(() => {
            n++;
            el.style.opacity = (n % 2 === 1) ? '0.15' : '1';
            if (n >= times * 2) { clearInterval(iv); el.style.opacity = '1'; }
        }, dur);
        calcIvs.push(iv);
    }
    function addStep(markup) {
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', '1040');
        t.setAttribute('y', String(calcStepY));
        t.setAttribute('fill', '#ffffff');
        t.setAttribute('font-weight', 'bold');
        t.setAttribute('class', 'calc-step');
        t.style.fontFamily = '"TNR-Embed", "Times New Roman", SimHei, sans-serif';
        t.innerHTML = markup;
        stepsGroup.appendChild(t);
        calcStepY += 105;
    }
    function resetCalc() {
        calcTimers.forEach(clearTimeout); calcTimers = [];
        calcIvs.forEach(clearInterval); calcIvs = [];
        calcIds.forEach(id => {
            const g = document.getElementById(id);
            g.style.visibility = 'hidden'; g.style.opacity = '1';
            g.querySelectorAll('polygon, text').forEach(el => el.style.opacity = '1');
            const p = g.querySelector('path');
            if (p) { p.style.transition = 'none'; p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; }
        });
        srcParts.forEach(id => {
            const el = document.querySelector('[data-id="' + id + '"]');
            if (el) el.classList.remove('src-hidden', 'src-text-hidden');
        });
        document.querySelectorAll('.res-purple').forEach(g => g.classList.remove('res-purple'));
        document.querySelectorAll('.green-flash').forEach(g => g.classList.remove('green-flash'));
        opampGroup.classList.remove('opamp-hidden');
        stepsGroup.innerHTML = '';
        calcStepY = 330;
    }
    // ===== 计算推导：按参数分三段（点击面板参数按钮触发），语音与演示内容不变 =====
    const CALC_PARTS = {
        av: [
            { text: '电压放大倍数的计算。',
              onStart: () => addStep('电压放大倍数 A<tspan class="sub">v</tspan>') },
            { text: '首先求Vp，因为虚断，同向端电流为0，所以，威p等于威埃。',
              onStart: () => {
                  blinkEl(document.getElementById('calc-vp'), 4, 200);
                  addT(() => blinkEl(document.getElementById('calc-ip'), 3, 225), 1700);
                  addT(() => addStep('V<tspan class="sub">p</tspan> = V<tspan class="sub">i</tspan>'), 3200);
              } },
            { text: '再根据虚短，威恩等于威批等于微埃。',
              onStart: () => {
                  blinkEl(document.getElementById('calc-vn'), 4, 200);
                  addT(() => addStep('V<tspan class="sub">n</tspan> = V<tspan class="sub">i</tspan>'), 800);
              } },
            { text: '因为虚断，反向端电流为0。',
              onStart: () => blinkEl(document.getElementById('calc-in'), 3, 225) },
            { text: '这时，R1与R2相当于串联。',
              onStart: () => {
                  ['comp-r1', 'comp-r2'].forEach(id => {
                      const g = document.querySelector('g[data-id="' + id + '"]');
                      g.classList.remove('res-purple'); void g.getBoundingClientRect();
                      g.classList.add('res-purple');
                  });
              } },
            { text: 'I1与I2相等。',
              onStart: () => {
                  blinkEl(document.getElementById('calc-i1'), 3, 225);
                  blinkEl(document.getElementById('calc-i2'), 3, 225);
                  addT(() => addStep('I<tspan class="sub">1</tspan> = I<tspan class="sub">2</tspan>'), 900);
              } },
            { text: '用电位差可表示出R1和R2的端电压，进一步表示出I1和I2。',
              onStart: () => {
                  const g = document.querySelector('g[data-id="comp-gnd-r1"]');
                  g.classList.remove('green-flash'); void g.getBoundingClientRect();
                  g.classList.add('green-flash');
                  blinkEl(document.getElementById('calc-node-r1'), 3, 225);
                  blinkEl(document.getElementById('calc-node-out'), 3, 225);
              } },
            { text: '经数学变换可得到，电压放大倍数Av，等于1加R1分之R2。',
              onStart: () => addStep('A<tspan class="sub">v</tspan> = V<tspan class="sub">o</tspan>/V<tspan class="sub">i</tspan> = 1 + R<tspan class="sub">2</tspan>/R<tspan class="sub">1</tspan>') }
        ],
        ri: [
            { text: '第二个指标参数，输入电阻阿尔埃。',
              onStart: () => {
                  resetCalc();   // 清空面板文字 + 图上符号/箭头/辅助点/变色
                  addStep('输入电阻 R<tspan class="sub">i</tspan>：');
              } },
            { text: '输入电阻阿尔埃，是从输入端看进去的电阻。',
              onStart: () => {
                  srcParts.forEach(id => document.querySelector('[data-id="' + id + '"]').classList.add('src-hidden'));   // 信号源只留 Vᵢ 文字
                  showEl(document.getElementById('calc-ri-box'));
                  wipeArrow(document.getElementById('calc-ri-arrow'));
              } },
            { text: '由于运放A输入电阻趋于无穷。',
              onStart: () => {
                  blinkEl(opampGroup, 3, 225);
                  addT(() => opampGroup.classList.add('opamp-hidden'), 1500);   // 运放消失（开路等效）
              } },
            { text: '同向端与反向端相当于开路。',
              onStart: () => blinkEl(document.getElementById('calc-ri-ellipse'), 3, 225) },   // 红椭圆此刻才出现
            { text: '所以输入电阻阿尔埃趋于无穷。',
              onStart: () => addStep('R<tspan class="sub">i</tspan> → ∞') }
        ],
        ro: [
            { text: '最后一个指标参数，输出电阻阿尔欧。',
              onStart: () => {
                  opampGroup.classList.remove('opamp-hidden');    // 提前恢复运放
                  document.getElementById('calc-ri-ellipse').style.visibility = 'hidden';   // 去掉椭圆
                  addStep('输出电阻 R<tspan class="sub">o</tspan>：');
              } },
            { text: '输出电阻是从输出端看进去的电阻。',
              onStart: () => {
                  document.querySelector('[data-id="comp-v1"]').classList.add('src-text-hidden');   // Vᵢ 文字也隐藏
                  showEl(document.getElementById('calc-ro-gnd'));   // 输入端口直接接地（独立源置零）
                  wipeArrow(document.getElementById('calc-ro-arrow'));
              } },
            { text: '理想运放A的输出电阻为0，引入反馈后，可理解为并联了一个网络，所以输出电阻还是为0。',
              onStart: () => addStep('R<tspan class="sub">o</tspan> → 0') }
        ]
    };
    const calcBtns = {
        av: document.getElementById('calc-btn-av'),
        ri: document.getElementById('calc-btn-ri'),
        ro: document.getElementById('calc-btn-ro')
    };
    function setActiveCalcBtn(key) {
        Object.keys(calcBtns).forEach(k => calcBtns[k].classList.toggle('active', k === key));
    }
    function startCalcSegment(key) {
        stopSpeak();                       // 作废正在播的其它语音
        resetCalc();
        calcRunning = true;
        calcSpeaking = true;
        setActiveCalcBtn(key);
        // Ro 段独立触发时，先摆出与连续播放到该段时一致的图面（信号源置零 + 虚线框 + 接地）
        if (key === 'ro') {
            srcParts.forEach(id => document.querySelector('[data-id="' + id + '"]').classList.add('src-hidden'));
            document.querySelector('[data-id="comp-v1"]').classList.add('src-text-hidden');
            showEl(document.getElementById('calc-ri-box'));
            showEl(document.getElementById('calc-ro-gnd'));
        }
        speakSeq(CALC_PARTS[key], () => {
            calcRunning = false; calcSpeaking = false;
            setActiveCalcBtn(null);
            // 收尾：清除图上演示元素、恢复完整电路（面板文字保留供复习）
            ['calc-ri-box', 'calc-ri-arrow', 'calc-ro-arrow', 'calc-ri-ellipse', 'calc-ro-gnd'].forEach(id => {
                const g = document.getElementById(id);
                g.style.visibility = 'hidden'; g.style.opacity = '1';
                g.querySelectorAll('polygon, text').forEach(el => el.style.opacity = '1');
                const p = g.querySelector('path');
                if (p) { p.style.transition = 'none'; p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; }
            });
            srcParts.forEach(id => document.querySelector('[data-id="' + id + '"]').classList.remove('src-hidden', 'src-text-hidden'));
            opampGroup.classList.remove('opamp-hidden');
        });
    }
    Object.keys(calcBtns).forEach(k => calcBtns[k].addEventListener('click', () => startCalcSegment(k)));

    document.querySelectorAll('.interactive').forEach(el => {
        const id = el.dataset.id;
        const conf = ANNOS[id];

        el.addEventListener('mouseenter', e => {
            if (id === 'calc-panel') return;   // 计算演示改由参数按钮触发
            if (conf) {
                showAnno(e, conf.text);
                if (!calcSpeaking) speakSeq(conf.parts);   // 计算演示中：只出注解，不抢语音
            }
            el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
        });
        el.addEventListener('mousemove', e => { if (conf) moveAnno(e); });
        el.addEventListener('mouseleave', () => {
            if (id === 'calc-panel') return;   // 计算过程演示不随鼠标移开中断
            hideAnno();
            if (!calcSpeaking) stopSpeak();    // 计算演示中不杀演示语音
            stopR3Demo(r3Group);
            plusSign.classList.remove('plus-blink', 'plus-red');
        });
        el.addEventListener('click', () => {
            el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
        });
    });

    // 关闭：通知父页面移除弹窗（也可独立打开时用 window.close）
    function requestClose() {
        stopSpeak();
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'close-circuit-lab' }, '*');
                return;
            }
        } catch (e) { /* 跨域等异常时走下面 */ }
        window.close();
    }

    // 返回：通知父页面关闭弹窗，回到打开本电路的上一级专题页面
    function requestBack() {
        stopSpeak();
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'back-circuit-lab' }, '*');
                return;
            }
        } catch (e) { /* 跨域等异常时走下面 */ }
        // 独立打开时：有历史则后退，否则回主站
        if (history.length > 1) history.back();
        else location.href = '../index.html';
    }
</script>
</body>
</html>
