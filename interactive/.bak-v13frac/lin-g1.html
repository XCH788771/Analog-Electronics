        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "TNR-Embed", "Times New Roman", SimHei, sans-serif, "PingFang SC";
    }
    /* 16:9 舞台，深绿背景 */
    .stage {
        aspect-ratio: 16 / 9;
        width: min(100vw, calc(100vh * 16 / 9));
        background: #0a3d20;
        position: relative;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }
    svg.circuit { width: 100%; height: 100%; display: block; }
    /* 英文字符/数字一律 Times New Roman，中文回落雅黑；!important 防任何覆盖 */
    svg.circuit, svg.circuit text, .anno { font-family: "TNR-Embed", "Times New Roman", SimHei, sans-serif !important; }

    /* ===== 可交互单元通用样式（元件 / 导线） ===== */
    .interactive { cursor: pointer; }
    .interactive:hover .hot { stroke: #ffe66d; filter: drop-shadow(0 0 6px rgba(255, 230, 109, 0.9)); }
    .interactive:hover .hot-fill { fill: rgba(255, 230, 109, 0.15); }
    .interactive:hover .hot-label { fill: #ffe66d; }
    /* fill=none 的矩形元件（电阻框等）内部也响应鼠标：默认 visiblePainted 只认边框，框中间是悬停/点击死区 */
    .interactive rect[fill="none"] { pointer-events: all; }
    .flash { animation: flashAnno 0.5s ease; }
    @keyframes flashAnno {
        0% { filter: drop-shadow(0 0 2px rgba(126, 247, 176, 0.4)); }
        50% { filter: drop-shadow(0 0 12px rgba(126, 247, 176, 1)); }
        100% { filter: drop-shadow(0 0 2px rgba(126, 247, 176, 0.4)); }
    }

    /* ===== 关闭 / 返回按钮（右上角，关闭在右、返回在左） ===== */
    .close-btn, .back-btn {
        position: absolute;
        top: 2.6%;
        width: 4.2%;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.55);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 2.2vmin;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s ease;
        z-index: 10;
    }
    .close-btn { right: 1.6%; }
    .back-btn  { right: 6.6%; }
    .close-btn:hover {
        background: #e74c3c;
        border-color: #e74c3c;
        transform: rotate(90deg);
    }
    .back-btn:hover {
        background: #3498db;
        border-color: #3498db;
        transform: translateX(-3px);
    }

    /* ===== 交互注解气泡 ===== */
    .anno {
        position: absolute;
        display: none;
        max-width: 340px;
        background: #ffffff;
        color: #123c26;
        padding: 10px 14px;
        border-radius: 8px;
        border-left: 4px solid #f1c40f;
        font-size: 15px;
        line-height: 1.55;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        z-index: 20;
        pointer-events: none;
    }

    /* ===== 通用闪烁动画（规范：3次、单次0.22s，闪烁后保持该色） ===== */
    @keyframes colorBlink {
        0%, 100% { stroke: var(--blink-color, #ffe66d); }
        50%      { stroke: #ffffff; }
    }
    g.color-blink .hot { stroke: var(--blink-color, #ffe66d); animation: colorBlink 0.22s ease 3; }
    g.color-blink text { fill: var(--blink-color, #ffe66d); }

    /* ===== Ri/Ro 演示通用隐藏类（放大器类电路通用） ===== */
    /* 运放开路等效时整体隐藏（含 A 字） */
    .opamp-hidden .hot, .opamp-hidden text { visibility: hidden; }
    /* 信号源置零：隐藏符号，仅保留 Vᵢ 文字标注 */
    .src-hidden *:not(text) { visibility: hidden; }
    /* Vᵢ 文字也隐藏（输入端口直接接地画法） */
    .src-text-hidden text { visibility: hidden; }

    /* ===== 计算过程演示 ===== */
    .calc-step text, text.calc-step { font-size: 46px; }
    .calc-step tspan.sub, tspan.sub { font-size: 100%; baseline-shift: -20%; }
    @keyframes stepIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .calc-step { animation: stepIn 0.5s ease; }
    /* ===== 参数分段按钮（Av/Ri/Ro…，点击触发对应计算段） ===== */
    .calc-btn { cursor: pointer; }
    .calc-btn rect {
        fill: rgba(255,255,255,0.10);
        stroke: rgba(255,255,255,0.55);
        stroke-width: 2;
        transition: all 0.2s ease;
    }
    .calc-btn text { fill: #ffffff; }
    .calc-btn:hover rect { fill: rgba(255,255,255,0.22); stroke: #ffffff; }
    .calc-btn.active rect { fill: rgba(255,230,109,0.18); stroke: #ffe66d; }
    .calc-btn.active text { fill: #ffe66d; }
    /* ===== 游戏闯关 UI（时尚配色：靛蓝底 · 紫罗兰主色 · 琥珀强调 · 薄荷成功 · 玫红错误 · 青色选中） ===== */
    .g-opt { cursor: pointer; }
    .g-opt > rect { fill: rgba(139,92,246,0.13); stroke: rgba(167,139,250,0.55); stroke-width: 2; transition: all 0.2s ease; }
    .g-opt:hover > rect { fill: rgba(139,92,246,0.32); stroke: #a78bfa; }
    .g-opt.dim { opacity: 0.35; pointer-events: none; }
    .g-opt.ok > rect { fill: rgba(52,211,153,0.20); stroke: #34d399; }
    .g-opt.bad > rect { fill: rgba(251,113,133,0.18); stroke: #fb7185; }
    .g-tab rect { fill: rgba(139,92,246,0.12); stroke: rgba(167,139,250,0.4); stroke-width: 2; }
    .g-tab.cur rect { fill: rgba(139,92,246,0.32); stroke: #a78bfa; }
    .g-tab.done rect { fill: rgba(52,211,153,0.18); stroke: #34d399; }
    .g-btn { cursor: pointer; }
    .g-btn > rect { fill: rgba(139,92,246,0.28); stroke: #a78bfa; stroke-width: 2.5; transition: all 0.2s ease; }
    .g-btn:hover > rect { fill: rgba(139,92,246,0.48); }
    .blank-box { cursor: pointer; transition: all 0.15s ease; }
    .blank-box:hover { stroke: #fde68a; fill: rgba(255,217,61,0.28); }
    .blank-box.sel { stroke: #22d3ee; stroke-width: 4; fill: rgba(34,211,238,0.15); }
    .blank-box.done { stroke: #34d399; fill: rgba(52,211,153,0.14); cursor: default; pointer-events: none; }
    /* ===== 当前关卡对应的电路级：整级变紫 + 闪烁提示 ===== */
    #circuit-wrap .stage-purple .hot { stroke: #a78bfa; }
    #circuit-wrap .stage-purple text { fill: #a78bfa; }
</style>
</head>

    function showAnno(e, html) { anno.innerHTML = html; anno.style.display = 'block'; moveAnno(e); }
    function moveAnno(e) {
        const r = stage.getBoundingClientRect();
        let x = e.clientX - r.left + 16;
        let y = e.clientY - r.top - anno.offsetHeight - 14;   // 默认：光标右上方
        if (y < 8) y = 8;
        if (x + anno.offsetWidth > r.width - 10) {            // 右侧放不下 → 左上方
            x = e.clientX - r.left - anno.offsetWidth - 16;
        }
        anno.style.left = x + 'px';
        anno.style.top = y + 'px';
    }
    function hideAnno() { anno.style.display = 'none'; }

    // 语音：逐句播放，onStart 与该句开口同步、onEnd 在该句播完时触发（被打断则不触发）；
    // 无 TTS 环境按字数估算节奏推进
    try { speechSynthesis.getVoices(); } catch (e) {}
    function speakSeq(parts, onDone) {
        const my = ++seqId;
        let i = 0;
        const next = (p) => {
            if (my !== seqId) return;
            if (p && p.onEnd) p.onEnd();
            if (i >= parts.length) { if (onDone) onDone(); return; }
            const cur = parts[i++];
            if (cur.onStart) cur.onStart();
            try {
                if (!window.speechSynthesis) {
                    setTimeout(() => { if (my === seqId) next(cur); }, Math.max(1200, cur.text.length * 200));
                    return;
                }
                const u = new SpeechSynthesisUtterance(cur.text);
                u.lang = 'zh-CN';
                const zh = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().indexOf('zh') === 0);
                if (zh) u.voice = zh;
                let done = false;
                const adv = () => { if (!done) { done = true; next(cur); } };
                u.onend = adv;
                u.onerror = adv;
                speechSynthesis.speak(u);
            } catch (e) {}
        };
        next();
    }
    function stopSpeak() { seqId++; try { speechSynthesis && speechSynthesis.cancel(); } catch (e) {} }

    //   ① 计算框架、填写表达式、选项表达式一律用分式（上下式）书写：
    //        tk(主,下标) 文本片段  |  {box:1} 虚线框（可作答） |  fr([分子],[分母]) 分式
    //   ② 面板版式（自上而下，勿改坐标）：
    //        关卡标题（红 #ff5252）→ 分隔线 → 关卡序号 → 固定小字（本关操作说明）
    //        → 自适应主体区（要求 + 选项 + 反馈）→ 状态行（已处理 X/n 项  本关得分 Y/m 分 + 🔊提醒按钮）
    //   ③ 左上角大标题：◆闯关挑战◆ XXXX电路 · 案例n（静态 SVG 内）
    //   ④ 已移除：评分标准行、最下方蓝色提示文字
    //   ⑤ 选项每次挑战随机排序；进入某关时该级电路整级变紫闪烁 3 次
    let calcTimers = [];
    let calcSpeaking = false;   // 预留：兼容旧事件绑定

    const NS = 'http://www.w3.org/2000/svg';
    const gameUI = document.getElementById('game-ui');

    // ---- 面板版式常量（统一标准，勿改） ----
    const LX = 1010, RX = 1530, LW = RX - LX, LCX = (LX + RX) / 2;
    const DIV_Y = 216;      // 分隔线
    const SUB_Y = 312;      // 固定小字基线（本关操作说明）
    const BODY_TOP = 334;   // 主体区上沿（要求 + 选项 + 反馈）
    const BODY_BOT = 704;   // 主体区下沿
    const FB_Y = 732;       // 反馈行基线（答对 / 扣分提示）
    const ST_Y = 774;       // 状态行基线
    const BTN = { x: 1416, y: 748, w: 114, h: 44 };   // 🔊提醒按钮

    function addT(fn, ms) { calcTimers.push(setTimeout(fn, ms)); }
    function showEl(g) { if (g) { g.style.visibility = 'visible'; g.style.opacity = '1'; } }
    function blinkEl(el, times, dur) {
        if (!el) return;
        let n = 0;
        showEl(el);
        const iv = setInterval(() => {
            n++;
            el.style.opacity = (n % 2 === 1) ? '0.15' : '1';
            if (n >= times * 2) { clearInterval(iv); el.style.opacity = '1'; }
        }, dur);
    }
    function blinkGroup(dataId, color) {
        const g = document.querySelector('g[data-id="' + dataId + '"]');
        if (!g) return;
        g.style.setProperty('--blink-color', color);
        g.classList.remove('color-blink'); void g.getBoundingClientRect();
        g.classList.add('color-blink');
    }

    // ---- 文本/分式片段构造器（★ 换案例的配置里通用） ----
    function tk(main, sub) { return { main: main, sub: sub }; }
    function fr(num, den) { return { frac: [num, den] }; }

    // ---- 案例配置（★ 换案例改这里） ----
    // 案例1：两级运放（第一级同相比例、第二级反相比例）；Aᵥ₁ = 1+R₂/R₁ = 11，Aᵥ₂ = −R₅/R₄ = −10，总 Aᵥ = −110
    // 分式写法：fr([分子tokens], [分母tokens])；{box:1} = 虚线框（第 3 关点框中电路元件作答）
    // 第 2 关框架选项：虚线框不显示具体符号，故每个选项必须结构上可区分（常数项 / 运算符 / 分式）
    const GAME_CONFIG = {
        stages: [
            {
                name: 'A1电路',
                typeQ: 'A<tspan class="sub">1</tspan>构成哪种电路？',

                typeAnswer: 0,
                typeWhy: '输入信号从同向端输入',
                frameworks: [   // Aᵥ₁ = Vₒ₁/Vᵢ = 1 + R₂/R₁
                    { tokens: [tk('A','v1'), tk('='), fr([{box:1}], [{box:1}]), tk('='), tk('1'), tk('+'), fr([{box:1}], [{box:1}])], correct: true },
                    { tokens: [tk('A','v1'), tk('='), fr([{box:1}], [{box:1}]), tk('='), tk('−'), fr([{box:1}], [{box:1}])] },
                    { tokens: [tk('A','v1'), tk('='), fr([{box:1}], [{box:1}]), tk('='), {box:1}, tk('×'), {box:1}] }
                ],
                blanks: [   // 按虚线框出现顺序：Vₒ₁、Vᵢ、R₂、R₁
                    { ansIds: ['comp-vo1'], label: [tk('V','o1')] },
                    { ansIds: ['comp-vi'], label: [tk('V','i')] },
                    { ansIds: ['comp-r2'], label: [tk('R','2')] },
                    { ansIds: ['comp-r1'], label: [tk('R','1')] }
                ]
            },
            {
                name: 'A2电路',
                typeQ: 'A<tspan class="sub">2</tspan>构成哪种电路？',
                typeOptions: ['反相放大电路', '同相放大电路', '电压跟随器', '求和电路', '求差电路'],
                typeAnswer: 0,
                typeWhy: '输入信号与反馈都从反向端汇合',
                frameworks: [   // Aᵥ₂ = Vₒ/Vₒ₁ = −R₅/R₄
                    { tokens: [tk('A','v2'), tk('='), fr([{box:1}], [{box:1}]), tk('='), tk('−'), fr([{box:1}], [{box:1}])], correct: true },
                    { tokens: [tk('A','v2'), tk('='), fr([{box:1}], [{box:1}]), tk('='), tk('1'), tk('+'), fr([{box:1}], [{box:1}])] },
                    { tokens: [tk('A','v2'), tk('='), fr([{box:1}], [{box:1}]), tk('='), {box:1}, tk('×'), {box:1}] }
                ],
                blanks: [   // 按虚线框出现顺序：Vₒ、Vₒ₁、R₅、R₄
                    { ansIds: ['comp-vo'], label: [tk('V','o')] },
                    { ansIds: ['comp-vo1'], label: [tk('V','o1')] },
                    { ansIds: ['comp-r5'], label: [tk('R','5')] },
                    { ansIds: ['comp-r4'], label: [tk('R','4')] }
                ]
            }
        ],
        // 第 4 关（不分級）：两级电路总电压放大倍数 Aᵥ 的表达式
        av: {
            options: [
                [tk('A','v'), tk('='), tk('A','v1'), tk('+'), tk('A','v2')],
                [tk('A','v'), tk('='), tk('A','v1'), tk('×'), tk('A','v2')],
                [tk('A','v'), tk('='), fr([tk('A','v1')], [tk('A','v2')])],
                [tk('A','v'), tk('='), fr([tk('A','v2')], [tk('A','v1')])]
            ],
            answer: 1,   // Aᵥ = Aᵥ₁ × Aᵥ₂（写原配置顺序下标，initState 洗牌后自动重映射）
            why: 'A<tspan class="sub">v</tspan> = A<tspan class="sub">v1</tspan> × A<tspan class="sub">v2</tspan> = 11 × (−10) = −110',
            say: '多级放大电路的总放大倍数等于各级放大倍数相乘，11乘负10等于负110。'
        },
        pts: { type: 8, fw: 12, fill: 24, av: 12 }   // ★ 计分微调处（fw 按 1/n 扣分；fill 按级、空均分）
        // 总分 = (8+12+24) × 2 级 + 12 = 100；第3关每级 24 分，每级 4 空、每空 6 分（答错扣 3）。
    };

    // ---- 各关卡对应的电路级交互单元（进入该关时整级变紫并闪烁提示） ----
    const STAGE_UNITS = [
        ['comp-vi', 'wire-in1', 'comp-r3', 'wire-in2', 'comp-opamp1', 'comp-input-pos1', 'comp-input-neg1',
         'wire-neg1', 'comp-r1', 'comp-gnd1', 'wire-r2a', 'comp-r2', 'wire-r2b', 'wire-out1', 'comp-vo1'],
        ['wire-link', 'comp-r4', 'wire-link2', 'comp-opamp2', 'comp-input-neg2', 'comp-input-pos2',
         'wire-r5a', 'comp-r5', 'wire-r5b', 'wire-out2', 'comp-vo', 'comp-r6']
    ];

    // ---- 运行状态（restart 整体重置） ----
    let S;
    let lastSay = [];   // 最近一次语音内容（提醒按钮重播用）
    // Fisher-Yates 洗牌（复制后打乱，不动原配置）
    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
    }
    function initState() {
        S = {
            score: 0, level: 1, stage: 0, msg: null, lastKey: null, lastLevel: null,
            levelStart: 0,
            typeOpts: [], typeAns: [], fwList: [], avOpts: [], avAns: null, avPick: null,
            typePicked: GAME_CONFIG.stages.map(() => null),
            fw: GAME_CONFIG.stages.map(() => ({ rem: GAME_CONFIG.pts.fw, solved: false, chosen: [] })),
            fill: GAME_CONFIG.stages.map(st => st.blanks.map(() => ({ rem: GAME_CONFIG.pts.fill / st.blanks.length, done: false }))),
            selBox: null, finished: false
        };
        // 每次挑战：选项与框架顺序随机；正确性由索引重映射 / correct 标志保证
        GAME_CONFIG.stages.forEach((st, i) => {
            S.typeOpts[i] = shuffle(st.typeOptions);
            S.typeAns[i] = S.typeOpts[i].indexOf(st.typeOptions[st.typeAnswer]);
            S.fwList[i] = shuffle(st.frameworks);   // correct 随对象一起移动，无需重映射
        });
        S.avOpts = shuffle(GAME_CONFIG.av.options);   // 元素为 token 数组，indexOf 按引用比对
        S.avAns = S.avOpts.indexOf(GAME_CONFIG.av.options[GAME_CONFIG.av.answer]);
    }
    // ---- 关卡切换（统一入口：重置分级 + 记录本关起始分） ----
    function gotoLevel(lv) { S.level = lv; S.stage = 0; S.levelStart = S.score; }

    // ---- 当前关卡对应电路级：整级变紫 + 闪烁（3 次 × 0.22s） ----
    function clearStageHighlight() {
        document.querySelectorAll('#circuit-wrap .stage-purple, #circuit-wrap .color-blink').forEach(g => {
            g.classList.remove('stage-purple');
            g.classList.remove('color-blink');
        });
    }
    function highlightStage(st) {
        clearStageHighlight();
        (STAGE_UNITS[st] || []).forEach(id => {
            const g = document.querySelector('g[data-id="' + id + '"]');
            if (!g) return;
            g.style.setProperty('--blink-color', '#a78bfa');
            g.classList.add('stage-purple');
            g.classList.add('color-blink');
            addT(() => g.classList.remove('color-blink'), 720);
        });
    }
    // 第 4 关（不分級）：两级电路整体高亮
    function highlightAll() {
        clearStageHighlight();
        STAGE_UNITS.reduce((a, b) => a.concat(b), []).forEach(id => {
            const g = document.querySelector('g[data-id="' + id + '"]');
            if (!g) return;
            g.style.setProperty('--blink-color', '#a78bfa');
            g.classList.add('stage-purple');
            g.classList.add('color-blink');
            addT(() => g.classList.remove('color-blink'), 720);
        });
    }
    function speechify(s) { return s.replace(/同相/g, '同向').replace(/反相/g, '反向'); }
    function rememberSay(texts) { lastSay = (texts || []).slice(); }
    function replaySay() { if (lastSay.length) speakSeq(lastSay.map(t => ({ text: t }))); }
    function say(text, onDone, onStart) {
        stopSpeak();
        const t = speechify(text);
        rememberSay([t]);
        speakSeq([{ text: t, onStart: onStart }], onDone);
    }
    // 关卡标题 / 固定小字（各关固定，与案例无关）
    function levelTitleText() {
        if (S.level === 1) return '第 1 关 · 判断电路类型';
        if (S.level === 2) return '第 2 关 · 选择表达式框架';
        if (S.level === 3) return '第 3 关 · 填写表达式';
        return GAME_CONFIG.av.levelTitle || '第 4 关 · 求总电压放大倍数';
    }
    function levelSubText() {
        if (S.level === 1) return '逐级判断电路的组态类型，点击下面选项作答';
        if (S.level === 2) return '选出正确的表达式框架，答对才能进入下一关';
        if (S.level === 3) return '先点表达式中的虚线框，再点电路中对应的元件';
        return '选出两级电路总电压放大倍数的表达式';
    }
    // 关卡语音报关：报关主句播完即闪烁电路、准备答题；操作说明作为第二句随后播放
    function announceLevel(hl) {
        const first = {
            1: '进入第一关，判断两级电路的类型。',
            2: '进入第二关，选择表达式框架。',
            3: '进入第三关，填写表达式。',
            4: GAME_CONFIG.av.announce || ('进入第四关，选择总电压放大倍数的表达式，答对得' + GAME_CONFIG.pts.av + '分。')
        }[S.level] || '';
        const extra = {
            2: '回答正确才能进入下一关。',
            3: '先点虚线框，再点对应的元件。'
        }[S.level];
        const parts = [{ text: speechify(first), onEnd: hl }];
        if (extra) parts.push({ text: speechify(extra) });
        rememberSay(parts.map(p => p.text));
        stopSpeak();
        speakSeq(parts);
    }
    function setMsg(text, color) { S.msg = text ? { text: text, color: color || '#ffffff' } : null; }
    // 本关总分 / 已处理项数（状态行用）
    function levelMax() {
        const n = GAME_CONFIG.stages.length;
        if (S.level === 1) return GAME_CONFIG.pts.type * n;
        if (S.level === 2) return GAME_CONFIG.pts.fw * n;
        if (S.level === 3) return GAME_CONFIG.pts.fill * n;
        return GAME_CONFIG.pts.av;
    }
    function levelDone() {
        if (S.level === 1) return S.typePicked.filter(x => x !== null).length;
        if (S.level === 2) return S.fw.filter(f => f.solved).length;
        if (S.level === 3) return S.fill.reduce((a, arr) => a + arr.filter(b => b.done).length, 0);
        return S.avPick !== null ? 1 : 0;
    }
    function levelTotal() {
        if (S.level === 1 || S.level === 2) return GAME_CONFIG.stages.length;
        if (S.level === 3) return S.fill.reduce((a, arr) => a + arr.length, 0);
        return 1;
    }
    function applyHooks() {
        const h = GAME_CONFIG.hooks;
        if (h && h[S.level]) h[S.level]();
    }

    // ---- SVG 小工具 ----
    function mkNSG() { return document.createElementNS(NS, 'g'); }
    function mkText(x, y, size, markup, opts) {
        opts = opts || {};
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('x', x); t.setAttribute('y', y);
        t.setAttribute('font-size', size);
        t.setAttribute('fill', opts.fill || '#ffffff');
        if (opts.anchor) t.setAttribute('text-anchor', opts.anchor);
        if (opts.bold !== false) t.setAttribute('font-weight', 'bold');
        t.style.fontFamily = '"TNR-Embed", "Times New Roman", SimHei, sans-serif';
        t.innerHTML = markup;
        return t;
    }
    function mkLine(x1, y1, x2, y2, stroke, w) {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', x1); l.setAttribute('y1', y1);
        l.setAttribute('x2', x2); l.setAttribute('y2', y2);
        l.setAttribute('stroke', stroke);
        l.setAttribute('stroke-width', w || 2);
        return l;
    }
    function mkBtn(x, y, w, h, cls) {
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('class', cls || 'g-opt');
        const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', x); r.setAttribute('y', y);
        r.setAttribute('width', w); r.setAttribute('height', h);
        r.setAttribute('rx', 10);
        g.appendChild(r);
        return g;
    }
    function markupOf(tok) {
        return tok.main + (tok.sub ? '<tspan class="sub">' + tok.sub + '</tspan>' : '');
    }
    // 分式（上下式）：分子/分母各按 tokens 逐段排版，中间画分数线
    function buildFrac(parent, numToks, denToks, size, fill, blank, ctx) {
        const fs = size * 0.84;
        const gf = mkNSG(); parent.appendChild(gf);
        const gN = mkNSG(); gf.appendChild(gN);
        buildExpr(gN, numToks, fs, fill, blank, ctx);
        const nw = gN.getBBox().width;
        const gD = mkNSG(); gf.appendChild(gD);
        buildExpr(gD, denToks, fs, fill, blank, ctx);
        const dw = gD.getBBox().width;
        const w = Math.max(nw, dw) + fs * 0.42;
        const barY = -size * 0.30;   // 分数线与同行文字（=、+ 等）的光学中线对齐，勿改回 -0.04（分式会下沉）
        gN.setAttribute('transform', 'translate(' + ((w - nw) / 2) + ',' + (barY - fs * 0.26) + ')');
        gD.setAttribute('transform', 'translate(' + ((w - dw) / 2) + ',' + (barY + fs * 0.96) + ')');
        gf.appendChild(mkLine(0, barY, w, barY, fill || '#ffffff', Math.max(2, Math.round(size * 0.055))));
        gf.__w = w;
        return gf;
    }
    // 逐段排版表达式：文本实时测宽 + 虚线框占位 + 分式
    // blank 传入时虚线框可点击作答；ctx = { n: 虚线框编号游标 }（跨行/跨分式连续编号）
    function buildExpr(parent, tokens, size, fill, blank, ctx) {
        ctx = ctx || { n: 0 };
        const g = mkNSG(); parent.appendChild(g);
        let cx = 0;
        (tokens || []).forEach(tok => {
            if (tok.box) {
                const w = size * 1.18, h = size * 0.80;
                const r = document.createElementNS(NS, 'rect');
                r.setAttribute('x', cx); r.setAttribute('y', -size * 0.58);
                r.setAttribute('width', w); r.setAttribute('height', h);
                r.setAttribute('rx', 6);
                r.setAttribute('fill', 'rgba(255,217,61,0.10)');
                r.setAttribute('stroke', '#ffd93d');
                r.setAttribute('stroke-width', 2.5);
                r.setAttribute('stroke-dasharray', '8 6');
                if (blank !== undefined && blank !== null) {
                    r.setAttribute('class', 'blank-box');
                    r.setAttribute('data-blank-stage', blank);
                    r.setAttribute('data-blank-idx', ctx.n);
                    r.setAttribute('pointer-events', 'all');
                }
                ctx.n++;
                g.appendChild(r);
                cx += w + size * 0.22;
            } else if (tok.frac) {
                const gf = buildFrac(g, tok.frac[0], tok.frac[1], size, fill, blank, ctx);
                gf.setAttribute('transform', 'translate(' + cx + ',0)');
                cx += gf.__w + size * 0.26;
            } else {
                const t = mkText(cx, 0, size, markupOf(tok), { fill: fill, anchor: 'start' });
                g.appendChild(t);
                cx += t.getComputedTextLength() + size * 0.10;
            }
        });
        return g;
    }
    // 表达式放入指定中心点
    function placeExpr(parent, tokens, size, cx, cy, fill, blank, ctx) {
        if (typeof ctx === 'number') ctx = { n: ctx };
        const g = buildExpr(parent, tokens, size, fill, blank, ctx);
        const bb = g.getBBox();
        g.setAttribute('transform', 'translate(' + (cx - bb.x - bb.width / 2) + ',' + (cy - bb.y - bb.height / 2) + ')');
        return g;
    }
    // 放进指定中心点并在超宽时整体缩字（maxW 默认面板可用宽度）
    function fitExpr(parent, tokens, size, cx, cy, fill, blank, ctx, maxW) {
        maxW = maxW || (LW - 40);
        if (typeof ctx === 'number') ctx = { n: ctx };
        const mark = ctx ? ctx.n : 0;
        let g = placeExpr(parent, tokens, size, cx, cy, fill, blank, ctx);
        const w = g.getBBox().width;
        if (w > maxW) {
            if (ctx) ctx.n = mark;     // 重排：虚线框编号回退，避免重复占号
            g.remove();
            g = placeExpr(parent, tokens, size * maxW / w, cx, cy, fill, blank, ctx);
        }
        return g;
    }

    // ---- 主体区自适应排版 ----
    // 行高自适应：在 avail 内取尽量大的行高（避免留白过多 / 文字过小）
    function planRows(n, avail, hMax, hMin, gapRatio) {
        hMax = hMax || 62; hMin = hMin || 36;
        gapRatio = gapRatio === undefined ? 0.18 : gapRatio;
        for (let h = hMax; h >= hMin; h -= 2) {
            const gap = Math.round(h * gapRatio);
            if (n * h + (n - 1) * gap <= avail) return { h: h, gap: gap };
        }
        const gap = Math.max(4, Math.round(avail * 0.02));
        const h = Math.max(26, Math.floor((avail - (n - 1) * gap) / n));
        return { h: h, gap: gap };
    }
    // 要求行 + nRows 个选项行：整体在主体区内垂直居中，行高自适应
    function layoutBody(qLines, qLH, nRows, opt) {
        opt = opt || {};
        const H = BODY_BOT - BODY_TOP;
        const qH = qLines.length * qLH;
        const gapBeforeRows = nRows ? 20 : 0;
        const plan = nRows
            ? planRows(nRows, Math.max(60, H - qH - gapBeforeRows), opt.hMax, opt.hMin, opt.gapRatio)
            : { h: 0, gap: 0 };
        const contentH = qH + gapBeforeRows + (nRows ? nRows * plan.h + (nRows - 1) * plan.gap : 0);
        const top = BODY_TOP + Math.max(0, (H - contentH) / 2);
        return { top: top, qLH: qLH, h: plan.h, gap: plan.gap, optTop: top + qH + gapBeforeRows };
    }

    // ---- 面板公共部分 ----
    function clearUI() { gameUI.innerHTML = ''; }
    function renderHeader() {
        // 关卡标题（统一红色）+ 总分（标题过长时自动缩字，避免与得分重叠）
        const tt = mkText(LX, 186, 32, levelTitleText(), { fill: '#ff5252' });
        gameUI.appendChild(tt);
        try {
            const tw = tt.getComputedTextLength();
            if (LX + tw > 1378) tt.setAttribute('font-size', Math.max(22, Math.floor(32 * (1378 - LX) / tw)));
        } catch (e) {}
        gameUI.appendChild(mkText(RX, 160, 22, '得分', { fill: 'rgba(255,255,255,0.6)', anchor: 'end', bold: false }));
        gameUI.appendChild(mkText(RX, 202, 42, S.score + '<tspan font-size="23" fill="rgba(255,255,255,0.6)"> / 100</tspan>', { fill: '#ffd93d', anchor: 'end' }));
        gameUI.appendChild(mkLine(LX, DIV_Y, RX, DIV_Y, 'rgba(167,139,250,0.4)', 2));
    }
    // 关卡序号（①判类型 ②选框架 ③填表达式 ④求总Aᵥ）
    function renderTabs() {
        const names = ['① 判类型', '② 选框架', '③ 填表达式', GAME_CONFIG.av.tab || '④ 求总Aᵥ'];
        const n = names.length, gp = 8;
        const w = Math.floor((LW - (n - 1) * gp) / n);
        names.forEach((nm, i) => {
            const x = LX + i * (w + gp);
            const st = (S.finished || S.level > i + 1) ? 'done' : (S.level === i + 1 ? 'cur' : '');
            const g = mkBtn(x, 230, w, 44, 'g-tab ' + st);
            g.appendChild(mkText(x + w / 2, 259, 20, nm, {
                anchor: 'middle', bold: false,
                fill: st === 'cur' ? '#c4b5fd' : (st === 'done' ? '#34d399' : 'rgba(241,240,255,0.7)')
            }));
            gameUI.appendChild(g);
        });
    }
    // 固定小字（本关操作说明，各关固定不变）
    function renderSubLine() {
        gameUI.appendChild(mkText(LX, SUB_Y, 22, levelSubText(), { fill: 'rgba(255,255,255,0.7)', bold: false }));
    }
    // 状态行：已处理 X/n 项    本关得分 Y/m 分   + 🔊提醒按钮（重播最近一次语音）
    function renderStatus() {
        const t1 = mkText(LX, ST_Y, 24, '已处理 ' + levelDone() + '/' + levelTotal() + ' 项', { fill: 'rgba(255,255,255,0.78)' });
        gameUI.appendChild(t1);
        let w1 = 200;
        try { w1 = t1.getComputedTextLength(); } catch (e) {}
        const x2 = Math.max(LX + w1 + 44, 1236);
        const t2 = mkText(x2, ST_Y, 24, '本关得分 ' + (S.score - S.levelStart) + '/' + levelMax() + ' 分', { fill: '#ffd93d' });
        gameUI.appendChild(t2);
        let w2 = 200;
        try { w2 = t2.getComputedTextLength(); } catch (e) {}
        if (x2 + w2 > BTN.x - 18) {
            t2.setAttribute('font-size', Math.max(16, Math.floor(24 * (BTN.x - 18 - x2) / w2)));
        }
        const g = mkBtn(BTN.x, BTN.y, BTN.w, BTN.h, 'g-btn');
        g.appendChild(mkText(BTN.x + BTN.w / 2, BTN.y + BTN.h / 2 + 8, 21, '🔊 提醒', { anchor: 'middle' }));
        g.addEventListener('click', replaySay);
        gameUI.appendChild(g);
    }
    // 反馈行（答对 / 扣分提示，位于主体区下方、状态行上方，单行）
    function renderFeedback() {
        if (!S.msg) return;
        const sz = 24;
        const max = Math.max(10, Math.floor(LW / sz));
        const text = S.msg.text.length > max ? S.msg.text.slice(0, max - 1) + '…' : S.msg.text;
        gameUI.appendChild(mkText(LX, FB_Y, sz, text, { fill: S.msg.color }));
    }

    // ---- 第 1 关：判类型（逐级） ----
    function renderL1() {
        const st = S.stage, cfg = GAME_CONFIG.stages[st];
        const qLines = [cfg.typeQ];
        const L = layoutBody(qLines, 40, S.typeOpts[st].length, { hMax: 62, hMin: 36, gapRatio: 0.16 });
        qLines.forEach((ln, i) => gameUI.appendChild(mkText(LX, L.top + 28 + i * L.qLH, 27, ln)));
        const answered = S.typePicked[st] !== null;
        const fs = Math.max(18, Math.min(27, Math.round(L.h * 0.46)));
        S.typeOpts[st].forEach((opt, i) => {
            const y = L.optTop + i * (L.h + L.gap);
            const g = mkBtn(LX, y, LW, L.h);
            let labelFill = '#ffffff';
            if (answered) {
                if (i === S.typeAns[st]) { g.classList.add('ok'); labelFill = '#34d399'; }
                else if (i === S.typePicked[st]) { g.classList.add('bad'); labelFill = '#fb7185'; }
                else g.classList.add('dim');
            }
            g.appendChild(mkText(LX + 24, y + L.h / 2 + fs * 0.36, fs, String.fromCharCode(65 + i) + '. ' + opt, { bold: false, fill: labelFill }));
            g.addEventListener('click', () => pickType(st, i));
            gameUI.appendChild(g);
        });
        renderStatus();
        renderFeedback();
    }
    function pickType(st, i) {
        if (S.finished || S.typePicked[st] !== null) return;
        const cfg = GAME_CONFIG.stages[st], pts = GAME_CONFIG.pts.type;
        S.typePicked[st] = i;
        if (i === S.typeAns[st]) {
            S.score += pts;
            setMsg('答对了，得 ' + pts + ' 分。', '#34d399');
            say('答对了！A' + (st + 1) + '构成' + S.typeOpts[st][i] + '，得' + pts + '分。', levelAdvance);
        } else {
            setMsg('不对，本题不得分。', '#fb7185');
            say('不对哦。' + cfg.typeWhy + '，A' + (st + 1) + '构成' + S.typeOpts[st][S.typeAns[st]] + '，本题不得分。', levelAdvance);
        }
        render();
    }

    // ---- 关卡推进 ----
    function levelAdvance() {
        if (S.finished) return;
        if (S.level === 1) {
            if (S.stage < GAME_CONFIG.stages.length - 1) { S.stage++; setMsg(null); render(); return; }
            gotoLevel(2);
            announceLevel(() => highlightStage(0));
            render(); return;
        }
        if (S.level === 2) {
            if (S.stage < GAME_CONFIG.stages.length - 1) { S.stage++; setMsg(null); render(); return; }
            gotoLevel(3);
            announceLevel(() => highlightStage(0));
            render(); return;
        }
    }

    // ---- 第 2 关：选框架（分式选项） ----
    function renderL2() {
        const st = S.stage, cfg = GAME_CONFIG.stages[st], fw = S.fw[st];
        const list = S.fwList[st];
        const qLines = [cfg.fwQ || ('A' + (st + 1) + ' 电路输出与输入关系式框架：')];
        const L = layoutBody(qLines, 38, list.length, { hMax: 108, hMin: 58, gapRatio: 0.14 });
        qLines.forEach((ln, i) => gameUI.appendChild(mkText(LX, L.top + 26 + i * L.qLH, 26, ln)));
        const base = Math.max(22, Math.min(36, Math.round(L.h * 0.40)));
        list.forEach((f, i) => {
            const y = L.optTop + i * (L.h + L.gap);
            const g = mkBtn(LX, y, LW, L.h);
            if (fw.solved) { if (f.correct) g.classList.add('ok'); else g.classList.add('dim'); }
            else if (fw.chosen.indexOf(i) >= 0) { g.classList.add('bad'); g.classList.add('dim'); }
            gameUI.appendChild(g);
            g.appendChild(mkText(LX + 22, y + L.h / 2 + 9, 24, String.fromCharCode(65 + i), { fill: 'rgba(255,255,255,0.55)' }));
            const col = (f.correct && fw.solved) ? '#34d399' : '#ffffff';
            fitExpr(g, f.tokens, base, LCX + 12, y + L.h / 2, col, null, null, LW - 96);
            g.addEventListener('click', () => pickFramework(st, i));
        });
        renderStatus();
        renderFeedback();
    }
    function pickFramework(st, i) {
        if (S.finished || S.level !== 2) return;
        const fw = S.fw[st];
        if (fw.solved || fw.chosen.indexOf(i) >= 0) return;
        fw.chosen.push(i);
        if (S.fwList[st][i].correct) {
            fw.solved = true;
            S.score += Math.round(fw.rem);
            setMsg('框架选对了，得 ' + Math.round(fw.rem) + ' 分。', '#34d399');
            say('框架选对了！A' + (st + 1) + '得' + Math.round(fw.rem) + '分。');
            render();
            addT(levelAdvance, 2400);
        } else {
            const pen = Math.round(GAME_CONFIG.pts.fw / S.fwList[st].length);
            fw.rem = Math.max(0, fw.rem - pen);
            setMsg('不对，扣 ' + pen + ' 分。', '#fb7185');
            say('不对，扣' + pen + '分。注意输入端与反馈的接法，再想一想。');
            render();
        }
    }

    // ---- 第 3 关：填表达式（分式，先点虚线框再点元件） ----
    function renderL3() {
        const st = S.stage, cfg = GAME_CONFIG.stages[st];
        const ftoks = S.fwList[st].filter(f => f.correct)[0].tokens;
        // 在最后一个 "=" 处折行（分式为整体，不再拆开）
        let cut = 0;
        ftoks.forEach((t, i) => { if (!t.box && !t.frac && t.main === '=') cut = i; });
        const lines = cut > 0 ? [ftoks.slice(0, cut), ftoks.slice(cut)] : [ftoks];
        gameUI.appendChild(mkText(LX, BODY_TOP + 26, 26, cfg.name + '表达式：', { fill: '#ffd93d' }));
        // 统一字号：先按基准字号测宽，超出可用宽度则整体缩放（两行同字号）
        const es = cfg.exprSize || 42;
        let maxW = 1;
        lines.forEach(toks => {
            const g = buildExpr(gameUI, toks, es, '#ffffff', null, { n: 0 });
            maxW = Math.max(maxW, g.getBBox().width);
            g.remove();
        });
        const fs = Math.max(20, Math.min(es, es * 470 / maxW));
        const areaTop = BODY_TOP + 64, areaBot = BODY_BOT - 14;
        const ctr = (areaTop + areaBot) / 2;
        const step = Math.min(112, (areaBot - areaTop) / Math.max(1, lines.length));
        const ctx = { n: 0 };
        lines.forEach((toks, li) => {
            placeExpr(gameUI, toks, fs, LCX, ctr + (li - (lines.length - 1) / 2) * step, '#ffffff', st, ctx);
        });
        // 已填好的空：绿色实线 + 内容回填
        S.fill[st].forEach((b, bi) => {
            if (!b.done) return;
            const r = gameUI.querySelector('.blank-box[data-blank-stage="' + st + '"][data-blank-idx="' + bi + '"]');
            if (!r) return;
            r.classList.add('done');
            const bw = parseFloat(r.getAttribute('width')), bh = parseFloat(r.getAttribute('height'));
            const bx = parseFloat(r.getAttribute('x')) + bw / 2;
            const by = parseFloat(r.getAttribute('y')) + bh / 2;
            const lg = buildExpr(r.parentNode, cfg.blanks[bi].label, Math.max(13, Math.round(bh * 0.70)), '#34d399');
            const bb2 = lg.getBBox();
            lg.setAttribute('transform', 'translate(' + (bx - bb2.x - bb2.width / 2) + ',' + (by - bb2.y - bb2.height / 2) + ')');
        });
        if (S.selBox && S.selBox.stage === st) {
            const r = gameUI.querySelector('.blank-box[data-blank-stage="' + st + '"][data-blank-idx="' + S.selBox.idx + '"]');
            if (r) r.classList.add('sel');
        }
        renderStatus();
        renderFeedback();
    }
    // 虚线框点选（面板内事件委托）
    gameUI.addEventListener('click', e => {
        const r = e.target.closest ? e.target.closest('.blank-box') : null;
        if (!r || r.classList.contains('done') || S.finished || S.level !== 3) return;
        S.selBox = {
            stage: parseInt(r.getAttribute('data-blank-stage'), 10),
            idx: parseInt(r.getAttribute('data-blank-idx'), 10)
        };
        render();
    });
    // 电路元件作答：点击电路中的交互单元，与选中空的 ansIds 比对
    document.querySelector('.stage').addEventListener('click', e => {
        if (S.finished || S.level !== 3 || !S.selBox) return;
        const gEl = e.target.closest ? e.target.closest('g.interactive') : null;
        if (!gEl || !gEl.dataset.id) return;
        answerBlank(gEl.dataset.id);
    });
    function answerBlank(id) {
        const st = S.selBox.stage, bi = S.selBox.idx;
        const cfg = GAME_CONFIG.stages[st], b = S.fill[st][bi];
        if (b.done) return;
        if (cfg.blanks[bi].ansIds.indexOf(id) >= 0) {
            b.done = true;
            S.score += Math.round(b.rem);
            blinkGroup(id, '#34d399');
            setMsg('填对了！得 ' + Math.round(b.rem) + ' 分。', '#34d399');
            say('填对了，得' + Math.round(b.rem) + '分。');
            S.selBox = null;
            if (S.fill[st].every(x => x.done)) addT(blankStageDone, 2000);
            render();
        } else {
            const half = Math.round((GAME_CONFIG.pts.fill / cfg.blanks.length) / 2);
            b.rem = Math.max(0, b.rem - half);
            blinkGroup(id, '#fb7185');
            setMsg('不对，本空扣 ' + half + ' 分。', '#fb7185');
            say('不对，本空扣' + half + '分。再想一想。');
            render();
        }
    }
    function blankStageDone() {
        if (S.finished) return;
        const st = S.stage;
        if (st < GAME_CONFIG.stages.length - 1) {
            setMsg(GAME_CONFIG.stages[st].name + '完成，继续。', '#ffd93d');
            say(GAME_CONFIG.stages[st].name + '表达式填写完成，继续。');
            S.stage++;
            render();
        } else {
            gotoLevel(4);
            announceLevel(() => highlightAll());
            render();
        }
    }

    // ---- 第 4 关：求总电压放大倍数 Aᵥ（不分級，单题；选项为分式表达式） ----
    function renderL4() {
        const qLines = [GAME_CONFIG.av.q || '两级电路的总电压放大倍数 A<tspan class="sub">v</tspan> = ？'];
        const n = S.avOpts.length;
        const L = layoutBody(qLines, 38, n, { hMax: 76, hMin: 42, gapRatio: 0.14 });
        qLines.forEach((ln, i) => gameUI.appendChild(mkText(LX, L.top + 26 + i * L.qLH, 26, ln)));
        const answered = S.avPick !== null;
        const base = Math.max(18, Math.min(32, Math.round(L.h * 0.38)));
        S.avOpts.forEach((toks, i) => {
            const y = L.optTop + i * (L.h + L.gap);
            const g = mkBtn(LX, y, LW, L.h);
            let col = '#ffffff';
            if (answered) {
                if (i === S.avAns) { g.classList.add('ok'); col = '#34d399'; }
                else if (i === S.avPick) { g.classList.add('bad'); col = '#fb7185'; }
                else g.classList.add('dim');
            }
            gameUI.appendChild(g);
            g.appendChild(mkText(LX + 22, y + L.h / 2 + 9, 24, String.fromCharCode(65 + i), { fill: 'rgba(255,255,255,0.55)' }));
            fitExpr(g, toks, base, LCX + 12, y + L.h / 2, col, null, null, LW - 96);
            g.addEventListener('click', () => pickAv(i));
        });
        renderStatus();
        renderFeedback();
    }
    function pickAv(i) {
        if (S.finished || S.level !== 4 || S.avPick !== null) return;
        S.avPick = i;
        if (i === S.avAns) {
            S.score += GAME_CONFIG.pts.av;
            setMsg('答对了，得 ' + GAME_CONFIG.pts.av + ' 分。', '#34d399');
            say('答对了！' + GAME_CONFIG.av.say + '得' + GAME_CONFIG.pts.av + '分。');
        } else {
            setMsg('不对，本题不得分。', '#fb7185');
            say('不对哦。' + GAME_CONFIG.av.say + '本题不得分。');
        }
        render();
        addT(finish, 2800);
    }

    // ---- 完成结算 ----
    function scoreBreakdown() {
        const p1 = GAME_CONFIG.stages.reduce((s2, st, i) => s2 + (S.typePicked[i] === S.typeAns[i] ? GAME_CONFIG.pts.type : 0), 0);
        const p2 = S.fw.reduce((s2, f) => s2 + f.rem, 0);
        const p3 = S.fill.reduce((s2, arr) => s2 + arr.reduce((a, b) => a + b.rem, 0), 0);
        const p4 = S.avPick !== null && S.avPick === S.avAns ? GAME_CONFIG.pts.av : 0;
        return [p1, Math.round(p2), Math.round(p3), p4];
    }
    function finish() {
        S.finished = true; S.selBox = null;
        say('恭喜你，完成全部关卡！最终得分' + S.score + '分。');
        render();
    }
    function renderDone() {
        const b = scoreBreakdown();
        gameUI.appendChild(mkText(LCX, 342, 42, '🎉 闯关完成！', { anchor: 'middle', fill: '#ffd93d' }));
        gameUI.appendChild(mkText(LCX, 428, 48, '最终得分：' + S.score + ' / 100', { anchor: 'middle', fill: '#ffd93d' }));
        gameUI.appendChild(mkText(LCX, 492, 25, '第1关 判类型：' + b[0] + ' 分', { anchor: 'middle', fill: 'rgba(255,255,255,0.85)', bold: false }));
        gameUI.appendChild(mkText(LCX, 528, 25, '第2关 选框架：' + b[1] + ' 分', { anchor: 'middle', fill: 'rgba(255,255,255,0.85)', bold: false }));
        gameUI.appendChild(mkText(LCX, 564, 25, '第3关 填表达式：' + b[2] + ' 分', { anchor: 'middle', fill: 'rgba(255,255,255,0.85)', bold: false }));
        gameUI.appendChild(mkText(LCX, 600, 25, (GAME_CONFIG.av.doneLabel || '第4关 求总Aᵥ') + '：' + b[3] + ' 分', { anchor: 'middle', fill: 'rgba(255,255,255,0.85)', bold: false }));
        const ev = S.score >= 90 ? '优秀！两级电路的分析已经掌握得很扎实。'
                 : S.score >= 75 ? '良好！再巩固一下表达式框架就更棒了。'
                 : S.score >= 60 ? '及格。建议回到"计算训练"再听一遍分级讲解。'
                 : '别灰心，点击"重新挑战"再闯一次！';
        gameUI.appendChild(mkText(LCX, 648, 26, ev, { anchor: 'middle', fill: '#34d399' }));
        const g = mkBtn(LCX - 110, 684, 220, 60, 'g-btn');
        g.appendChild(mkText(LCX, 722, 29, '重新挑战', { anchor: 'middle' }));
        g.addEventListener('click', restart);
        gameUI.appendChild(g);
    }
    function restart() {
        calcTimers.forEach(clearTimeout); calcTimers = [];
        stopSpeak();
        initState();
        applyHooks();
        render();
        addT(() => announceLevel(() => highlightStage(0)), 300);
    }

    // ---- 总渲染入口 ----
    function render() {
        clearUI();
        applyHooks();
        renderHeader();
        renderTabs();
        renderSubLine();
        // 同一关内换级：即时闪烁该级电路；换关的闪烁由关卡语音播完触发（见 announceLevel）
        const key = S.finished ? 'done' : (S.level + '-' + S.stage);
        if (S.lastKey !== key) {
            const newLevel = S.finished || S.level !== S.lastLevel;
            S.lastKey = key;
            S.lastLevel = S.finished ? null : S.level;
            if (!newLevel) addT(() => { if (!S.finished) highlightStage(S.stage); }, 320);
        }
        if (S.finished) { renderDone(); return; }
        if (S.level === 1) renderL1();
        else if (S.level === 2) renderL2();
        else if (S.level === 3) renderL3();
        else renderL4();
    }
    initState();
    render();
    // 进入第 1 关：语音播完才闪烁电路（稍延迟给 TTS 就绪留时间）
    addT(() => announceLevel(() => highlightStage(0)), 400);
    // 测试钩子：自动化自检读取内部状态（只读）
    function getState() { return S; }
    // 调试预览（自查/截图用）：?lvl=2 / ?lvl=3 / ?lvl=4 / ?lvl=done
    (function () {
        const m = location.search.match(/[?&]lvl=(\w+)/);
        if (!m) return;
        const v = m[1];
        if (v === '2') gotoLevel(2);
        else if (v === '3') gotoLevel(3);
        else if (v === '4') gotoLevel(4);
        else if (v === 'done') { S.finished = true; }
        else return;
        render();
        if (v !== 'done') addT(() => { if (v === '4') highlightAll(); else highlightStage(S.stage); }, 320);
    })();

    // ===== 事件绑定（框架通用，勿改） =====
    // 游戏页：不挂悬停注解/语音（防止直接提示答案），仅保留点击闪烁反馈
    document.querySelectorAll('.interactive').forEach(el => {
        el.addEventListener('click', () => {
            el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
        });
    });

    // 关闭：通知父页面移除弹窗（也可独立打开时用 window.close）
    function requestClose() {
        stopSpeak();
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'close-circuit-lab' }, '*');
                return;
            }
        } catch (e) { /* 跨域等异常时走下面 */ }
        window.close();
    }

    // 返回：通知父页面关闭弹窗，回到打开本电路的上一级专题页面
    function requestBack() {
        stopSpeak();
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'back-circuit-lab' }, '*');
                return;
            }
        } catch (e) { /* 跨域等异常时走下面 */ }
        // 独立打开时：有历史则后退，否则回主站
        if (history.length > 1) history.back();
        else location.href = '../index.html';
    }
</script>
</body>
</html>
