            }
        } catch (e) { /* 跨域等异常时走下面 */ }
        window.close();
    }

    // 返回：通知父页面关闭弹窗，回到打开本电路的上一级专题页面
    function requestBack() {
        stopSpeak();
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'back-circuit-lab' }, '*');
                return;
            }
        } catch (e) { /* 跨域等异常时走下面 */ }
        // 独立打开时：有历史则后退，否则回主站
        if (history.length > 1) history.back();
        else location.href = '../index.html';
    }

    /* ===== 校徽金色粒子烟雾汇聚入场（第 55 轮：上半页烟状飘入 × 软边自左向右浮现） =====
       从校徽 PNG 的 alpha 通道实时采样墨迹点（换图免重采样），生成两层粒子——
       ① 细粒子 ~1500 枚（实心金尘）：从「整个页面上半部分」的随机位置像烟一样飘向自己的墨迹点，
          到达后上飘放大、不断消散；按目标点 x 分批到达（最左侧先到、汇聚点自左向右推进）；
       ② 烟雾层 ~130 枚（软边大烟团）：同自上半页飘入，营造体积烟雾感；
       校徽由 SVG 软边遮罩 #logoReveal 同步自左向右柔和浮现（mask 内黑块左沿羽化，SMIL 平移驱动） */
    (function initLogoFx() {
        var CFG = { WANT: 1300, STEP: 2, TH: 110, MIND: 2.2, SEED: 20261010,
                    T0: 0.55, SWEEP: 1.10, PUFFS: 180, LAUNCH: 0.55,
                    PW: 1600, PH: 470,                  // 起飞区：整个页面上半部分
                    MX: 945, MY: 36, MW: 462, MH: 70 };
        var img = document.getElementById('school-logo');
        var host = document.querySelector('#logo-fx .logo-particles');
        var href = img && img.getAttribute('href');
        if (!host || !href) return;
        var rnd = (function (s) {   // mulberry32：种子随机，每次加载同一分布
            return function () {
                s |= 0; s = s + 0x6D2B79F5 | 0;
                var t = Math.imul(s ^ s >>> 15, 1 | s);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        })(CFG.SEED);
        var probe = new Image();
        probe.onload = function () {
            var W = probe.naturalWidth, H = probe.naturalHeight, i, x, y;
            if (!W || !H) return;
            var a;
            try {   // data-uri 图不污染画布；异常时只退化为无粒子，校徽照常浮现
                var cv = document.createElement('canvas');
                cv.width = W; cv.height = H;
                var ctx = cv.getContext('2d');
                ctx.drawImage(probe, 0, 0);
                var d = ctx.getImageData(0, 0, W, H).data;
                a = new Uint8Array(W * H);
                for (i = 0, x = 3; i < a.length; i++, x += 4) a[i] = d[x];
            } catch (e) { return; }
            var ink = function (p, q) {     // 3×3 邻域最大 alpha（抗锯齿边缘也计入）
                var b = 0, dx, dy, xx, yy, v;
                for (dx = -1; dx <= 1; dx++) for (dy = -1; dy <= 1; dy++) {
                    xx = p + dx; yy = q + dy;
                    if (xx >= 0 && xx < W && yy >= 0 && yy < H) { v = a[yy * W + xx]; if (v > b) b = v; }
                }
                return b;
            };
            var cand = [], sx, sy, px, py;
            for (sy = 1; sy < H - 1; sy += CFG.STEP) for (sx = 1; sx < W - 1; sx += CFG.STEP) {
                px = Math.round(sx + (rnd() - 0.5) * CFG.STEP);
                py = Math.round(sy + (rnd() - 0.5) * CFG.STEP);
                if (px >= 0 && px < W && py >= 0 && py < H && ink(px, py) > CFG.TH) cand.push([px, py]);
            }
            for (i = cand.length - 1; i > 0; i--) {         // Fisher-Yates（种子随机）
                var k = (rnd() * (i + 1)) | 0, t = cand[i]; cand[i] = cand[k]; cand[k] = t;
            }
            var pts = [], m2 = CFG.MIND * CFG.MIND, c, j, q, ok;
            for (i = 0; i < cand.length && pts.length < CFG.WANT; i++) {
                c = cand[i]; ok = true;
                for (j = 0; j < pts.length; j++) {
                    q = pts[j];
                    if ((c[0] - q[0]) * (c[0] - q[0]) + (c[1] - q[1]) * (c[1] - q[1]) < m2) { ok = false; break; }
                }
                if (ok) pts.push(c);
            }
            var frag = [], RS = [0.70, 0.85, 1.00, 1.15, 1.30],  // 细粒子（实心金尘）
                COLS = ['#ffd93d', '#ffd93d', '#ffe66d', '#f7c948'],
                PR = [5, 7, 9, 11, 14, 16], i2;               // 烟雾层（软边大烟团）
            for (var i = 0; i < pts.length; i++) {
                var ex = CFG.MX + pts[i][0] * CFG.MW / W, ey = CFG.MY + pts[i][1] * CFG.MH / H;
                var u = (ex - CFG.MX) / CFG.MW;                 // 0=最左列 → 1=最右列
                var st = rnd() * CFG.LAUNCH;                    // 起飞时刻：前 0.55s 内陆续起飞（全上半页可见烟飘）
                var dur = Math.max(0.55, CFG.T0 + u * CFG.SWEEP - st);   // 到达时刻左先右后 → 反推飞行时长
                var delay = (st + (rnd() - 0.5) * 0.1).toFixed(2);
                sx = (rnd() * CFG.PW).toFixed(0); sy = (rnd() * CFG.PH).toFixed(0);   // 起飞点：上半页随机
                var o = (0.40 + rnd() * 0.55).toFixed(2);
                var exd = ((rnd() - 0.5) * 90).toFixed(0);
                var eyd = (-10 - rnd() * 50).toFixed(0);
                frag.push('<circle class="lp" cx="' + ex.toFixed(1) + '" cy="' + ey.toFixed(1) +
                    '" r="' + RS[(rnd() * RS.length) | 0] + '" fill="' + COLS[(rnd() * COLS.length) | 0] +
                    '" style="--dx:' + (sx - ex).toFixed(1) + 'px;--dy:' + (sy - ey).toFixed(1) + 'px;' +
                    '--o:' + o + ';--exd:' + exd + 'px;--eyd:' + eyd + 'px;' +
                    '--dur:' + dur.toFixed(2) + 's;animation-delay:' + delay + 's"/>');
            }
            for (i = 0; i < CFG.PUFFS; i++) {                   // 烟雾层：目标为校徽框内随机点（营造体积感）
                var tx = CFG.MX - 24 + rnd() * (CFG.MW + 48), ty = CFG.MY - 16 + rnd() * (CFG.MH + 32);
                var u2 = Math.max(0, Math.min(1, (tx - CFG.MX) / CFG.MW));
                var st2 = rnd() * (CFG.LAUNCH + 0.15);
                var d2 = Math.max(0.80, CFG.T0 + u2 * CFG.SWEEP + 0.25 - st2);   // 烟团慢速大步
                var de2 = (st2 + (rnd() - 0.5) * 0.15).toFixed(2);
                sx = (rnd() * CFG.PW).toFixed(0); sy = (rnd() * CFG.PH).toFixed(0);
                frag.push('<circle class="lp" cx="' + tx.toFixed(1) + '" cy="' + ty.toFixed(1) +
                    '" r="' + PR[(rnd() * PR.length) | 0] + '" fill="' + (rnd() < 0.5 ? 'url(#lpGoldA)' : 'url(#lpGoldB)') +
                    '" style="--dx:' + (sx - tx).toFixed(1) + 'px;--dy:' + (sy - ty).toFixed(1) + 'px;' +
                    '--o:' + (0.14 + rnd() * 0.18).toFixed(2) +
                    ';--exd:' + ((rnd() - 0.5) * 120).toFixed(0) + 'px;--eyd:' + (-14 - rnd() * 60).toFixed(0) + 'px;' +
                    '--dur:' + d2.toFixed(2) + 's;animation-delay:' + de2 + 's"/>');
            }
            host.innerHTML = frag.join('');
        };
        probe.src = href;
    })();
</script>
