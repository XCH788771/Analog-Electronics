    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #02120a; overflow: hidden; }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "TNR-Embed", "Times New Roman", SimHei, sans-serif, "PingFang SC";
    }
    /* 16:9 舞台，深绿背景 */
    .stage {
        aspect-ratio: 16 / 9;
        width: min(100vw, calc(100vh * 16 / 9));
        background: #0a3d20;
        position: relative;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }
    svg.circuit { width: 100%; height: 100%; display: block; }
    /* 英文字符/数字一律 Times New Roman，中文回落雅黑；!important 防任何覆盖 */
    svg.circuit, svg.circuit text, .anno { font-family: "TNR-Embed", "Times New Roman", SimHei, sans-serif !important; }

    /* ===== 可交互单元通用样式（元件 / 导线） ===== */
    .interactive { cursor: pointer; }
    .interactive:hover .hot { stroke: #ffe66d; filter: drop-shadow(0 0 6px rgba(255, 230, 109, 0.9)); }
    /* 纯命中区矩形（stroke="none"）任何状态都不描边：避免关卡高亮/悬停时 BJT 等元件浮出方框 */
    rect.hot[stroke="none"] { stroke: none !important; }
    .interactive:hover .hot-fill { fill: rgba(255, 230, 109, 0.15); }
    .interactive:hover .hot-label { fill: #ffe66d; }
    /* fill=none 的矩形元件（电阻框等）内部也响应鼠标：默认 visiblePainted 只认边框，框中间是悬停/点击死区 */
    .interactive rect[fill="none"] { pointer-events: all; }
    /* 第64轮：命中隔离 class——隐藏状态层/标注层内的 rect.hot 会被上面的规则重新赋权，
       opacity:0 的隐形热区仍参与 elementFromPoint，压住下方元件抢走悬停/点击
       （qlabel-layer 的 q-beta/q-vceq/q-vbe/q-ibq 隐形热区曾让「BJT 等效」菜单不灵敏）。
       加在 <g> 上的 class 以 !important 断子孙命中，且不像 inline 那样被 resetCircuit 清理。 */
    .hit-off, .hit-off * { pointer-events: none !important; }
    .flash { animation: flashAnno 0.5s ease; }
    @keyframes flashAnno {
        0% { filter: drop-shadow(0 0 2px rgba(126, 247, 176, 0.4)); }
        50% { filter: drop-shadow(0 0 12px rgba(126, 247, 176, 1)); }
        100% { filter: drop-shadow(0 0 2px rgba(126, 247, 176, 0.4)); }
    }

    /* ===== 关闭 / 返回按钮（右上角，关闭在右、返回在左） ===== */
    .close-btn, .back-btn {
        position: absolute;
        top: 2.6%;
        width: 4.2%;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.55);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 2.2vmin;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s ease;
        z-index: 10;
    }
    .close-btn { right: 1.6%; }
    .back-btn  { right: 6.6%; }
    .close-btn:hover {
        background: #e74c3c;
        border-color: #e74c3c;
        transform: rotate(90deg);
    }
    .back-btn:hover {
        background: #3498db;
        border-color: #3498db;
        transform: translateX(-3px);
    }

    /* ===== 交互注解气泡 ===== */
    .anno {
        position: absolute;
        display: none;
        max-width: 340px;
        background: #ffffff;
        color: #123c26;
        padding: 10px 14px;
        border-radius: 8px;
        border-left: 4px solid #f1c40f;
        font-size: 15px;
        line-height: 1.55;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        z-index: 20;
        pointer-events: none;
    }

    /* ===== 元件悬停选择菜单（短路/断路、置零/保留 等） ===== */
    .ctxmenu {
        position: absolute;
        display: none;
        flex-direction: column;
        gap: 7px;
        z-index: 30;
        pointer-events: auto;
    }
    .ctxmenu .mi {
        background: rgba(20, 26, 56, 0.97);
        border: 2.5px solid #8b5cf6;
        color: #ffffff;
        border-radius: 9px;
        padding: 9px 20px;
        font-size: 17px;
        font-weight: bold;
        line-height: 1;
        text-align: center;
        cursor: pointer;
        white-space: nowrap;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.5);
        transition: background 0.15s ease, border-color 0.15s ease;
    }
    .ctxmenu .mi:hover { background: #8b5cf6; border-color: #c4b5fd; }
    .ctxmenu .mi.ok { border-color: #34d399; color: #a7f3d0; }
    .ctxmenu .mi.ok:hover { background: #34d399; color: #06261a; }
    .ctxmenu .mi-sub { font-size: 15px; opacity: 0.85; }
    /* 水平排列变体：晶体管等效问答选项条（固定在电路图上方空白处，不遮挡电路） */
    .ctxmenu.horiz { flex-direction: row; gap: 16px; }
    .ctxmenu.horiz .mi { padding: 11px 24px; font-size: 18px; }

    /* ===== 通用闪烁动画（规范：3次、单次0.22s，闪烁后保持该色） ===== */
    @keyframes colorBlink {
        0%, 100% { stroke: var(--blink-color, #ffe66d); }
        50%      { stroke: #ffffff; }
    }
    g.color-blink .hot { stroke: var(--blink-color, #ffe66d); animation: colorBlink 0.22s ease 3; }
    g.color-blink .hot-label { fill: var(--blink-color, #ffe66d); }
    /* ===== 元件高亮只作用于「本体符号 + 标注文字」（2026-10-10 定稿） =====
       重绘件（rarr-* / eq-* / fx-t-rbe / fx-t-re1）的连接导线带 .keepw：悬停金、作答绿/红、阶段紫等
       任何高亮态下导线都保持原白色——只有电阻矩形与文字变色（连接导线不是元件本体） */
    .interactive:hover .hot.keepw,
    g.color-blink .hot.keepw,
    #circuit-wrap .stage-purple .hot.keepw,
    #circuit-wrap .color-blink .hot.keepw,
    #circuit-wrap .stage-purple .color-blink .hot.keepw {
        stroke: #ffffff !important;
        filter: none !important;
        animation: none !important;
    }
    /* ===== 校徽金色粒子烟雾汇聚入场（第 55 轮定稿·上半页烟状飘入 × 软边自左向右浮现） =====
       粒子由 JS 按校徽 PNG alpha 通道实时采样墨迹点生成（约 1520 枚），每枚从「整个页面上半
       部分」的随机位置像烟雾一样飘向自己的墨迹点（飞行 0.85~1.30s），到达后上飘、放大、不断
       消散；左侧先到、汇聚点自左向右推进；校徽由 SVG 软边遮罩 #logoReveal 同步自左向右柔和
       浮现（羽化 ~300px，无硬边、无遮挡物） */
    #logo-fx .logo-glow { opacity: 0; animation: logoGlowIn 0.9s ease-out 1.3s both; }
    #logo-fx #school-logo {
        opacity: 0;                                    /* 保底：遮罩异常的环境也不至于闪现全图 */
        animation: logoFade 0.35s ease-out 0.45s both;
    }
    #logo-fx .lp {
        fill: #ffd93d; opacity: 0;
        animation: logoConverge var(--dur, 1s) cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes logoConverge {
        0%   { opacity: 0; transform: translate(var(--dx, 0px), var(--dy, 0px)); }
        24%  { opacity: var(--o, 0.5); }
        62%  { opacity: var(--o, 0.5); transform: translate(0px, 0px); }
        100% { opacity: 0; transform: translate(var(--exd, 0px), var(--eyd, -18px)); }
    }
    @keyframes logoFade { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes logoGlowIn { 0% { opacity: 0; } 45% { opacity: 1; } 100% { opacity: 1; } }

    /* ===== Q点电量标注（qlabel-layer）：任何状态保持红色 ===== */
    /* 悬停不换色，仅加红色光晕反馈 */
    #qlabel-layer .interactive:hover .hot { stroke: #ff5252; filter: drop-shadow(0 0 6px rgba(255, 82, 82, 0.9)); }
    #qlabel-layer .interactive:hover .hot-label { fill: #ff5252; }
    #qlabel-layer .interactive:hover .hot-fill { fill: #ff5252; }
    /* 作答反馈：只做透明度闪烁，颜色不变（3 次 × 0.22s） */
    @keyframes redBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    g.red-blink { animation: redBlink 0.22s ease 3; }

    /* ===== 晶体管等效五连问：B/C/E 端点红点（持续闪烁） ===== */
    @keyframes qdotBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }
    .qdot { animation: qdotBlink 0.55s ease-in-out infinite; }

    /* ===== Ri/Ro 演示通用隐藏类（放大器类电路通用） ===== */
    /* 运放开路等效时整体隐藏（含 A 字） */
    .opamp-hidden .hot, .opamp-hidden text { visibility: hidden; }
    /* 信号源置零：隐藏符号，仅保留 Vᵢ 文字标注 */
    .src-hidden *:not(text) { visibility: hidden; }
    /* Vᵢ 文字也隐藏（输入端口直接接地画法） */
    .src-text-hidden text { visibility: hidden; }

    /* ===== 计算过程演示 ===== */
    .calc-step text, text.calc-step { font-size: 46px; }
    .calc-step tspan.sub, tspan.sub { font-size: 75%; baseline-shift: -20%; }   /* 下标缩小1/4（2026-10-07 定稿），同步布局工具 SUB_SCALE=0.75 */
    @keyframes stepIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .calc-step { animation: stepIn 0.5s ease; }
    /* ===== 参数分段按钮（Av/Ri/Ro…，点击触发对应计算段） ===== */
    .calc-btn { cursor: pointer; }
    .calc-btn rect {
        fill: rgba(255,255,255,0.10);
        stroke: rgba(255,255,255,0.55);
        stroke-width: 2;
        transition: all 0.2s ease;
    }
    .calc-btn text { fill: #ffffff; }
    .calc-btn:hover rect { fill: rgba(255,255,255,0.22); stroke: #ffffff; }
    .calc-btn.active rect { fill: rgba(255,230,109,0.18); stroke: #ffe66d; }
    .calc-btn.active text { fill: #ffe66d; }
    /* ===== 游戏闯关 UI（时尚配色：靛蓝底 · 紫罗兰主色 · 琥珀强调 · 薄荷成功 · 玫红错误 · 青色选中） ===== */
    .g-opt { cursor: pointer; }
    .g-opt > rect { fill: rgba(139,92,246,0.13); stroke: rgba(167,139,250,0.55); stroke-width: 2; transition: all 0.2s ease; }
    .g-opt:hover > rect { fill: rgba(139,92,246,0.32); stroke: #a78bfa; }
    .g-opt.dim { opacity: 0.35; pointer-events: none; }
    .g-opt.ok > rect { fill: rgba(52,211,153,0.20); stroke: #34d399; }
    .g-opt.bad > rect { fill: rgba(251,113,133,0.18); stroke: #fb7185; }
    .g-tab rect { fill: rgba(139,92,246,0.12); stroke: rgba(167,139,250,0.4); stroke-width: 2; }
    .g-tab.cur rect { fill: rgba(139,92,246,0.32); stroke: #a78bfa; }
    .g-tab.done rect { fill: rgba(52,211,153,0.18); stroke: #34d399; }
    .g-btn { cursor: pointer; }
    .g-btn > rect { fill: rgba(139,92,246,0.28); stroke: #a78bfa; stroke-width: 2.5; transition: all 0.2s ease; }
    .g-btn:hover > rect { fill: rgba(139,92,246,0.48); }
    .blank-box { cursor: pointer; transition: all 0.15s ease; }
    .blank-box:hover { stroke: #fde68a; fill: rgba(255,217,61,0.28); }
    .blank-box.sel { stroke: #22d3ee; stroke-width: 4; fill: rgba(34,211,238,0.15); }
    .blank-box.done { stroke: #34d399; fill: rgba(52,211,153,0.14); cursor: default; pointer-events: none; }
    /* ===== 当前关卡对应的电路级：整级变紫 + 闪烁提示 ===== */
    #circuit-wrap .stage-purple .hot { stroke: #a78bfa; }
    #circuit-wrap .stage-purple text { fill: #a78bfa; }
    /* 悬停优先：任何高亮态下，鼠标移到元件上仍整体变金色（文字 + 符号一起，2026-10-10 定稿） */
    #circuit-wrap .stage-purple .interactive:hover .hot { stroke: #ffe66d; }
    #circuit-wrap .stage-purple .interactive:hover text { fill: #ffe66d; }
    #circuit-wrap .color-blink .interactive:hover .hot { stroke: #ffe66d; }
    #circuit-wrap .color-blink .interactive:hover text { fill: #ffe66d; }
    /* 已作答反馈（绿/红）优先于阶段高亮：点选元件的绿色不被阶段紫色盖住 */
    #circuit-wrap .stage-purple .color-blink .hot { stroke: var(--blink-color); }
    #circuit-wrap .stage-purple .color-blink text { fill: var(--blink-color); }
</style>
</head>

    function showAnno(e, html) { anno.innerHTML = html; anno.style.display = 'block'; moveAnno(e); }
    function moveAnno(e) {
        const r = stage.getBoundingClientRect();
        let x = e.clientX - r.left + 16;
        let y = e.clientY - r.top - anno.offsetHeight - 14;   // 默认：光标右上方
        if (y < 8) y = 8;
        if (x + anno.offsetWidth > r.width - 10) {            // 右侧放不下 → 左上方
            x = e.clientX - r.left - anno.offsetWidth - 16;
        }
        anno.style.left = x + 'px';
        anno.style.top = y + 'px';
    }
    function hideAnno() { anno.style.display = 'none'; }

    // ===== 元件悬停选择菜单（短路/断路、置零/保留 …） =====
    const ctxmenu = document.getElementById('ctxmenu');
    let menuTimer = null, menuOwner = null, menuLock = false;
    function hideMenu() {
        clearTimeout(menuTimer);
        menuLock = false;
        if (ctxmenu) { ctxmenu.style.display = 'none'; ctxmenu.innerHTML = ''; ctxmenu.classList.remove('horiz'); }
        menuOwner = null;
    }
    // anchorEl：菜单锚定元件（贴其右侧/左侧弹出）；pos：{cx,cy}（SVG 坐标，水平条模式，居中放置，不随元件走）
    function showMenu(anchorEl, items, lock, pos) {
        if (!ctxmenu) return;
        menuLock = !!lock;
        ctxmenu.innerHTML = '';
        items.forEach(it => {
            const d = document.createElement('div');
            d.className = 'mi' + (it.cls ? ' ' + it.cls : '');
            if (it.html) d.innerHTML = it.html; else d.textContent = it.label;   // 选项可带下标等富文本（如 ↑i_b）
            d.addEventListener('click', ev => {
                ev.stopPropagation();
                const anchor = menuOwner;
                hideMenu();
                if (it.fn) it.fn(anchor);
            });
            ctxmenu.appendChild(d);
        });
        menuOwner = anchorEl;
        ctxmenu.style.visibility = 'hidden';
        ctxmenu.style.display = 'flex';
        const sr = stage.getBoundingClientRect();
        if (pos) {
            // 水平条模式：按 SVG 坐标换算成舞台像素，居中放置（用于等效问答选项条——电路上方空白带）
            ctxmenu.classList.add('horiz');
            const sx = sr.width / 1600, sy = sr.height / 900;
            const mw = ctxmenu.offsetWidth, mh = ctxmenu.offsetHeight;
            let x = pos.cx * sx - mw / 2;
            let y = pos.cy * sy - mh / 2;
            if (x < 8) x = 8;
            if (y < 8) y = 8;
            ctxmenu.style.left = x + 'px';
            ctxmenu.style.top = y + 'px';
        } else {
            ctxmenu.classList.remove('horiz');
            const br = anchorEl.getBoundingClientRect();
            const mw = ctxmenu.offsetWidth, mh = ctxmenu.offsetHeight;
            let x = br.left - sr.left + br.width + 12;
            let y = br.top - sr.top + br.height / 2 - mh / 2;
            if (x + mw > sr.width - 8) x = br.left - sr.left - mw - 12;
            if (x < 8) x = 8;
            if (y + mh > sr.height - 8) y = sr.height - mh - 8;
            if (y < 8) y = 8;
            ctxmenu.style.left = x + 'px';
            ctxmenu.style.top = y + 'px';
        }
        ctxmenu.style.visibility = 'visible';
    }
    function menuSoonHide() { clearTimeout(menuTimer); if (!menuLock) menuTimer = setTimeout(hideMenu, 240); }
    if (ctxmenu) {
        ctxmenu.addEventListener('mouseenter', () => clearTimeout(menuTimer));
        ctxmenu.addEventListener('mouseleave', menuSoonHide);
    }

    // 语音：逐句播放，onStart 与该句开口同步、onEnd 在该句播完时触发（被打断则不触发）；
    // 无 TTS 环境按字数估算节奏推进
    try { speechSynthesis.getVoices(); } catch (e) {}
    function speakSeq(parts, onDone) {
        const my = ++seqId;
        let i = 0;
        const next = (p) => {
            if (my !== seqId) return;
            if (p && p.onEnd) p.onEnd();
            if (i >= parts.length) { if (onDone) onDone(); return; }
            const cur = parts[i++];
            if (cur.onStart) cur.onStart();
            try {
                if (!window.speechSynthesis) {
                    setTimeout(() => { if (my === seqId) next(cur); }, Math.max(1200, cur.text.length * 200));
                    return;
                }
                const u = new SpeechSynthesisUtterance(cur.text);
                u.lang = 'zh-CN';
                const zh = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().indexOf('zh') === 0);
                if (zh) u.voice = zh;
                let done = false;
                // 看门狗：Chrome 在快速连续 cancel()+speak() 时可能静默丢弃语音（onend/onerror 均不触发），
                // 回调链断裂导致关卡无法推进（第2关快速点击电量可复现卡死）。超时兜底强制推进。
                const adv = (byGuard) => { if (done) return; done = true; clearTimeout(guard);
                    if (byGuard) { try { speechSynthesis.cancel(); } catch (e) {} } next(cur); };
                const guard = setTimeout(() => adv(true), Math.max(3000, cur.text.length * 200 + 2000));
                u.onend = () => adv(false);
                u.onerror = () => adv(false);
                speechSynthesis.speak(u);
            } catch (e) {}
        };
        next();
    }
    function stopSpeak() { seqId++; try { speechSynthesis && speechSynthesis.cancel(); } catch (e) {} }

    // ===================== 游戏闯关引擎 v2（cj-g1：两大阶段 · 五关） =====================
    // 结构：静态分析（①绘制直流通路 ②Q点计算步骤 ③Q点计算·框架+表达式交错）
    //       动态分析（④绘制交流微变等效电路 ⑤动态指标 Av/Ri/Ro·框架+表达式交错）
    // 计分：10 + 16 + 27 + 14 + 33 = 100
    //   draw 关：悬停元件在菜单里选处理方式，每项平分本关分值；选错只减该项分值池（每错 1 分，扣完为 0），答对给该项剩余分值（可为 0）

    //   fw 关：n 选 1，每答错一次扣 pts/n（取整，从该项分值池扣），答对给剩余分值
    //   fill 关：先点虚线框再点电路元件，每空首错扣该空一半（池语义同上）
    let calcTimers = [];
    let calcSpeaking = false;

    const gameUI = document.getElementById('game-ui');

    function addT(fn, ms) { calcTimers.push(setTimeout(fn, ms)); }
    function showEl(g) { if (g) { g.style.visibility = 'visible'; g.style.opacity = '1'; } }
    function blinkEl(el, times, dur) {
        if (!el) return;
        let n = 0;
        showEl(el);
        const iv = setInterval(() => {
            n++;
            el.style.opacity = (n % 2 === 1) ? '0.15' : '1';
            if (n >= times * 2) { clearInterval(iv); el.style.opacity = '1'; }
        }, dur);
    }
    function blinkGroup(dataId, color) {
        const all = Array.prototype.slice.call(document.querySelectorAll('g[data-id="' + dataId + '"]'));
        // 微变等效模型 #fx-tmodel 的 data-id 是 comp-t-model，但作答判定值为 comp-t：
        // 并入候选，否则点 r_be 作答时闪烁落在已隐藏的晶体管本体上（无任何反馈）
        if (dataId === 'comp-t') {
            const tm = document.getElementById('fx-tmodel');
            if (tm) all.push(tm);
        }
        let g = all[0];
        // 同一 data-id 可能有多个元素（本体 / 整理态下挂件 / 等效层重绘件）：闪烁当前可见的那个
        for (const x of all) { if (x.style.opacity !== '0') { g = x; break; } }
        if (!g) return;
        // 等效态点 r_be（comp-t）时 blinkGroup 会落在整块 #fx-tmodel 上：
        // 收窄到 #fx-t-rbe —— 只高亮 r_be 电阻体与标注，不波及受控源支路、i_b / βi_b 箭头
        if (g.id === 'fx-tmodel') {
            const rbe = document.getElementById('fx-t-rbe');
            if (rbe) g = rbe;
        }
        if (g.closest('#qlabel-layer')) {   // 电量标注保持红色：只做透明度闪烁，不改颜色
            g.classList.remove('red-blink'); void g.getBoundingClientRect();
            g.classList.add('red-blink');
            addT(() => g.classList.remove('red-blink'), 800);
            return;
        }
        g.style.setProperty('--blink-color', color);
        g.classList.remove('color-blink'); void g.getBoundingClientRect();
        g.classList.add('color-blink');
    }
    // 恢复电路初态（重新挑战 / 从静态阶段进入动态阶段前）
    // ★换案例：清零清单须包含新增特效层/状态层 id（漏加会导致重玩残留）
    function resetCircuit() {
        clearStageHighlight();
        setCircuitShift(false);
        document.querySelectorAll('#circuit-wrap g').forEach(g2 => { g2.style.opacity = ''; g2.style.pointerEvents = ''; });
        // 第64轮：hit-off 是 class 形式、不随上面的 inline 清理恢复——重玩/进关前统一解除
        //   （qlabel-layer 的隔离由随后 render()→updateQlabels() 按当前关卡重设）
        document.querySelectorAll('#circuit-wrap .hit-off').forEach(g2 => { g2.classList.remove('hit-off'); });
        ['fx-c1', 'fx-c2', 'fx-ce', 'fx-vcc', 'fx-vee', 'fx-vs', 'fx-re2', 'fx-gnd-rc', 'fx-gnd-e',
         'fx-gnd-rail', 'fx-gnd-jct', 'fx-ce-tail', 'fx-re2-wire',
         'fx-tmodel', 'rarr-rc',
         'fx-t-rbe', 'fx-t-src', 'fx-t-ib', 'fx-t-ic', 'fx-dot-b', 'fx-dot-c', 'fx-dot-e',
         'eq-layer', 'eq-rb', 'eq-re1'].forEach(id => {
            const f = document.getElementById(id);
            if (f) { f.style.opacity = '0'; f.style.pointerEvents = ''; }
        });
        // 第87轮：等效层可作答件隐藏时补 hit-off——eq-rb/eq-re1 的 rect.hot 被
        //   `.interactive rect[fill="none"]{PE:all}` 重新赋权，隐形热区会参与 elementFromPoint、
        //   压住默认态电量标注（实测：eq-rb 热区盖住 q-ibq 文字 → I_BQ 点击无反应，与 qlabel-layer 同款）
        ['eq-rb', 'eq-re1'].forEach(id => { const f = document.getElementById(id); if (f) f.classList.add('hit-off'); });
        document.querySelectorAll('.vcc-label, .vee-label').forEach(t => { t.style.opacity = ''; t.style.visibility = ''; });
        // 第91轮：第4关整理态/等效态位移复位 + 整理态接缝补线收起（第93轮扩为 4 组）

    function setCircuitShift(up) {

        if (w) w.setAttribute('transform', 'translate(18, ' + (up ? 159 : 199) + ') scale(1)');
    }

    // 语音文本归一化：同相/反相→同向/反向；「得到X分」→「获得X分」；分数里的 2 读「两」（否则读成 èr）
    function speechify(s) {
        return s.replace(/同相/g, '同向').replace(/反相/g, '反向')
            .replace(/得到/g, '获得')
            .replace(/(^|[^0-9])2分/g, '$1两分');
    }
    let lastSay = [];   // 最近一次语音内容（提醒按钮重播用）
    function rememberSay(texts) { lastSay = (texts || []).slice(); }
    function replaySay() { if (lastSay.length) speakSeq(lastSay.map(t => ({ text: t }))); }
    function say(text, onDone, onStart) {
        stopSpeak();
        const t = speechify(text);
        rememberSay([t]);
        speakSeq([{ text: t, onStart: onStart }], onDone);
    }
    function setMsg(text, color) { S.msg = text ? { text: text, color: color || '#ffffff' } : null; }
    // 连续播报多句（记得住内容，供 🔊 提醒按钮整段重播）；空串自动剔除
    function saySeq(texts) {
        const arr = (texts || []).filter(t => t);
        if (!arr.length) return;
        rememberSay(arr);
        stopSpeak();
        speakSeq(arr.map(t => ({ text: speechify(t) })));
    }

    //   ① 门控电源（Vs / +Vcc / −Vee）处理完 → 请选择电容处理方式

    //   ③ 第 4 关整理步骤全部处理完 → 请等效 BJT
    function nextHint(c, d, id) {
        if (c.gate && c.gate.indexOf(id) >= 0 && c.gate.every(g => d.found[g])) {
            return (c.targets || []).some(t => !d.found[t.id]) ? '请选择电容处理方式。' : '';
        }
        if (!c.subSteps) return '';
        // ★换案例：第4关电容/电阻清单与语音引导链文案（nextHint）
        const CAPS = ['comp-c1', 'comp-c2', 'comp-ce'];

        if (RES.indexOf(id) < 0 && CAPS.indexOf(id) < 0) return '';
        const resDone = !!(d.found['comp-re2'] && d.found['comp-re1'] && d.moved && d.moved['comp-rc']);
        // 本提示语由 saySeq 播报（语音串）：不得出现带下标的符号原文（会被念出「下划线」）→ 用注音（第70轮规约）
        if (CAPS.indexOf(id) >= 0 && CAPS.every(x => d.found[x]) && !resDone) return '请选择阿尔意1、阿尔意2和阿尔C的整理方式，先整理哪一个都可以。点击阿尔意2的移除选项后，移除阿尔意2，同时把电路调整为，阿尔意1直接连到地。';
        if (RES.indexOf(id) >= 0 && resDone) return '请等效BJT。';
        return '';
    }

    // Fisher-Yates 洗牌（复制后打乱，不动原配置）
    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const t = a[i]; a[i] = a[j]; a[j] = t;

        return a;

    //   route='base' 基极优先：I_BQ → 简化 → I_CQ → V_CEQ（用 subsBase）
    function mixRoute() { const r = S.route; return (r === 'base' || r === 'cq') ? r : 'eq'; }

                    qs: qs.map(q => ({
                        label: q.label || '', fwQ: q.fwQ || '选择正确的表达式框架：', say: q.say || '',
                        opts: shuffle(q.frameworks), chosen: [], solved: false,
                        rem: per, pen: q.pen || Math.round(per / q.frameworks.length)
                    }))
                };
            }
            if (c.kind === 'fill') S.fill[i] = c.blanks.map(() => ({ rem: c.pts / c.blanks.length, done: false }));
            // 框架 + 表达式交错：subs[].type='fw' → 三选项框架题；'fill' → 一行表达式（per-blank 分值）
            // 第 3 关（静态）的 subs 由第 2 关所选路线决定 → mkMixState + mixSubsFor 生成
            if (c.kind === 'mix') S.mix[i] = mkMixState(mixSubsFor(c));
        });
    }
    function cur() { return LEVELS[S.level - 1]; }
    // 计算顺序展开：seq 项为数组＝无序组（组内顺序不限，但都要点到）
    function flatSeq(seq) { return (seq || []).reduce(function (a, k) { return a.concat(Array.isArray(k) ? k : [k]); }, []); }
    function groupOf(exp) { return Array.isArray(exp) ? exp : [exp]; }
    // ---- 第2关「Q点计算步骤」：支持多条合法顺序（c.seqs；每步可为 id 或可接受 id 数组）----
    function qSeqs(c) { return c.seqs || [c.seq || []]; }        // 兼容旧的单条 c.seq
    function qLen(c) { return Math.max.apply(null, qSeqs(c).map(function (x) { return x.length; })); }
    // 本关涉及的全部电量 id（用于「点错对象」判定）
    function qAllIds(c) {
        const out = [];
        qSeqs(c).forEach(function (s2) {
            s2.forEach(function (x) { [].concat(x).forEach(function (y) { if (out.indexOf(y) < 0) out.push(y); }); });
        });
        return out;
    }
    // 已点前缀 d 之后「下一步」可接受的 id 集合（多条合法顺序取并集）
    function qAccept(c, d) {
        const acc = [];
        qSeqs(c).forEach(function (s2) {
            if (d.length >= s2.length) return;
            for (let k = 0; k < d.length; k++) if ([].concat(s2[k]).indexOf(d[k]) < 0) return;
            [].concat(s2[d.length]).forEach(function (x) { if (acc.indexOf(x) < 0) acc.push(x); });
        });
        return acc;
    }
    // 与已点前缀相容的「最长」合法顺序步数（进度条总步数随路线收敛：含 I_EQ 5 步 / 省略 I_EQ 4 步）
    function qSpan(c, d) {
        let n = 0;
        qSeqs(c).forEach(function (s2) {
            if (d.length > s2.length) return;
            for (let k = 0; k < d.length; k++) if ([].concat(s2[k]).indexOf(d[k]) < 0) return;
            n = Math.max(n, s2.length);
        });
        return n || qLen(c);
    }
    // 首步 id → 所在顺序对应的计算路线（routes 见区 C：eq / cq / base）
    function qRouteOf(c, id) {
        const ss = qSeqs(c), rt = c.routes || ['eq', 'cq', 'base'];
        for (let si = 0; si < ss.length; si++) if ([].concat(ss[si][0]).indexOf(id) >= 0) return rt[si] || 'eq';
        return 'eq';
    }
    // 交错关子步重排：带 qid 的子步按第 2 关实际点选顺序排列（I_BQ 与 V_CEQ 可互换）；无 qid 的保持原序
    function arrangeMixSubs(i) {
        const c = LEVELS[i] && LEVELS[i].cfg, mx = S.mix[i];
        if (!c || c.kind !== 'mix' || !mx) return;
        // 第76轮：静态 Q 点关先按第 2 关所选路线换套（eq / cq / base 三方案），再按实际点选顺序重排子步；
        //   排序键为「块 qid」（mixQids：框架与表达式同块）→ I_BQ 与 V_CEQ 两块随第 2 关点选先后互换
        const subs = (c.subsC || c.subsBase) ? mixSubsFor(c) : (c.subs || []);
        const steps = subs.map(mkMixStep);
        const keys = mixQids(subs);
        const qi = LEVELS.findIndex(function (L2) { return L2.kind === 'qorder'; });
        const picked = (qi >= 0 && S.qorder[qi] && S.qorder[qi].done) || [];
        const pos = function (id) { const k = id ? picked.indexOf(id) : -1; return k < 0 ? 999 : k; };
        const order = subs.map(function (sb, k) { return k; })
            .sort(function (a, b) { return pos(keys[a]) - pos(keys[b]); });
        mx.subs = order.map(function (k) { return subs[k]; });
        mx.steps = order.map(function (k) { return steps[k]; });
        mx.stepsOrig = steps.slice();
        mx.si = 0; S.selBox = null; S.mixQ[i] = undefined;
    }
    // 计分：全部经 addScore/penalize，保证 levelScore 与 score 同步（用于结算分项）
    function addScore(n) { S.levelScore[S.level - 1] += n; S.score += n; }
    function penalize(n) {           // 扣分不低于本关 0 分
        const take = Math.min(n, S.levelScore[S.level - 1]);
        if (take > 0) { S.levelScore[S.level - 1] -= take; S.score -= take; }
    }

    // ---- 当前关卡对应电路级：整级变紫 + 闪烁（3 次 × 0.22s） ----
    function clearStageHighlight() {
        document.querySelectorAll('#circuit-wrap .stage-purple, #circuit-wrap .color-blink').forEach(g => {
            g.classList.remove('stage-purple');
            g.classList.remove('color-blink');
        });
    }
    // 静态 Q 点计算关：第 si 个子步（要求为「框架」）对应的电量标注 id。
    //   第 58 轮起子步自带 qid（要闪的电量标注），与 qorder 顺序解耦、支持子步重排
    function fwBlinkQId(L, si) {
        const c = L.cfg;
        if (!c || c.kind !== 'mix') return null;
        const mx = S.mix[S.level - 1];
        const subs = (mx && mx.subs) || c.subs;
        const sub = subs && subs[si];
        return (sub && sub.qid) || null;   // 第 58 轮：子步直接带 qid，与 qorder 顺序解耦（支持重排）
    }
    function highlightStage(st) {
        clearStageHighlight();
        (STAGE_UNITS[st] || []).forEach(id => {
            const g = document.querySelector('g[data-id="' + id + '"]');
            if (!g) return;
            g.style.setProperty('--blink-color', '#a78bfa');
            g.classList.add('stage-purple');
            g.classList.add('color-blink');
            // 闪 3 次后连 stage-purple 一并撤掉：电路不再常驻变紫，悬停/点选反馈才可见
            addT(() => { g.classList.remove('color-blink'); g.classList.remove('stage-purple'); }, 720);
        });
    }
    // 绘制关不高亮（避免提示答案）；其余关卡按 stageUnits 高亮
    function highlightFor(L) {
        if (!L || L.cfg.stageUnits === undefined) return null;
        return () => highlightStage(L.cfg.stageUnits);
    }
    // 关卡语音报关：主句播完触发高亮，操作说明随后
    function announceLevel(hl) {
        const c = cur().cfg;
        const parts = [{ text: speechify(c.announce), onEnd: hl || undefined }];
        if (c.extra) parts.push({ text: speechify(c.extra) });
        rememberSay(parts.map(p => p.text));
        stopSpeak();
        speakSeq(parts);
    }

    // ---- SVG 小工具 ----
    function mkText(x, y, size, markup, opts) {
        opts = opts || {};
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('x', x); t.setAttribute('y', y);
        t.setAttribute('font-size', size);
        t.setAttribute('fill', opts.fill || '#ffffff');
        if (opts.anchor) t.setAttribute('text-anchor', opts.anchor);
        if (opts.bold !== false) t.setAttribute('font-weight', 'bold');
        if (opts.italic) t.setAttribute('font-style', 'italic');
        t.style.fontFamily = '"TNR-Embed", "Times New Roman", SimHei, sans-serif';
        t.innerHTML = markup;
        return t;
    }
    function mkLine(x1, y1, x2, y2, stroke, w) {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', x1); l.setAttribute('y1', y1);
        l.setAttribute('x2', x2); l.setAttribute('y2', y2);
        l.setAttribute('stroke', stroke);
        l.setAttribute('stroke-width', w || 2);
        return l;
    }
    function mkBtn(x, y, w, h, cls) {
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('class', cls || 'g-opt');
        const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', x); r.setAttribute('y', y);
        r.setAttribute('width', w); r.setAttribute('height', h);
        r.setAttribute('rx', 10);
        g.appendChild(r);
        return g;
    }
    function markupOf(tok) {
        return tok.main + (tok.sub ? '<tspan class="sub">' + tok.sub + '</tspan>' : '');
    }
    // 估算一行 tokens 的墨迹纵向范围（相对基线，负=向上）：盒用几何值，文字按字号比例
    // （不能用 getBBox：它对 text 返回字体 em 框而非紧贴墨迹，会把间距算小）
    function inkExtent(tokens, fs) {
        let top = 0, bot = 0;
        (tokens || []).forEach(t => {
            if (t.box) { top = Math.min(top, -fs * 0.70); bot = Math.max(bot, fs * 0.10); }
            // 嵌套分式：top 按内层分子框顶实测 -1.19×fs 估（第67轮）；bot 为内层分母底 ≈0.59×fs
            else if (t.frac) { top = Math.min(top, -fs * 1.20); bot = Math.max(bot, fs * 0.62); }
            else {
                const op = /[+−≈=∥]/.test(t.main || '');
                top = Math.min(top, /[()]/.test(t.main || '') ? -fs * 0.75 : (op ? -fs * 0.50 : -fs * 0.66));
                bot = Math.max(bot, t.sub ? fs * 0.26 : (op ? fs * 0.06 : fs * 0.02));
            }
        });
        return { top: top, bot: bot };
    }
    // 分式（上下式）：分子/分母各按 tokens 逐段排版，中间画分数线
    function buildFrac(parent, numToks, denToks, size, fill, blankLevel, ctx) {
        const fs = size * 0.84;
        const gf = document.createElementNS(NS, 'g'); parent.appendChild(gf);
        const gN = document.createElementNS(NS, 'g'); gf.appendChild(gN);
        buildExpr(gN, numToks, fs, fill, blankLevel, ctx);
        const nw = gN.getBBox().width;
        const gD = document.createElementNS(NS, 'g'); gf.appendChild(gD);
        buildExpr(gD, denToks, fs, fill, blankLevel, ctx);
        const dw = gD.getBBox().width;
        const w = Math.max(nw, dw) + fs * 0.42;
        const barY = -size * 0.30;   // 分数线与同行文字（=、+ 等）的光学中线对齐，勿改回 -0.04（分式会下沉）
        // 分子与分母到分数线的间距相等：以「分数线→分母墨迹顶端」为准，分子基线随之抬高，
        // 使「分子墨迹底端→分数线」的间距与其相同（墨迹范围用 inkExtent 估算，勿用 getBBox）
        // 分母含嵌套分式时整体下移（第67轮）：内层分子顶 -1.19fs 须回到分数线下方
        const denHasFrac = (denToks || []).some(t => t.frac);
        const denBase = barY + fs * (denHasFrac ? 1.35 : 0.96);
        const gap = (denBase + inkExtent(denToks, fs).top) - barY;
        const numBase = barY - gap - inkExtent(numToks, fs).bot;
        gN.setAttribute('transform', 'translate(' + ((w - nw) / 2) + ',' + numBase + ')');
        gD.setAttribute('transform', 'translate(' + ((w - dw) / 2) + ',' + denBase + ')');
        gf.appendChild(mkLine(0, barY, w, barY, fill || '#ffffff', Math.max(2, Math.round(size * 0.055))));
        gf.__w = w;
        return gf;
    }
    // 逐段排版表达式：文本实时测宽 + 虚线框占位 + 分式；blankLevel 传入时框可点击作答（填表达式关）
    // ctx = { n: 虚线框编号游标 }（跨行/跨分式连续编号）；兼容旧调用传数字 startBoxN
    function buildExpr(parent, tokens, size, fill, blankLevel, ctx) {
        ctx = (ctx === undefined || ctx === null || typeof ctx === 'number') ? { n: ctx || 0 } : ctx;
        const g = document.createElementNS(NS, 'g');
        parent.appendChild(g);
        let cx = 0;
        (tokens || []).forEach(tok => {
            if (tok.box || tok.dbox) {
                const w = size * 1.18, h = size * 0.80;
                const r = document.createElementNS(NS, 'rect');
                r.setAttribute('x', cx); r.setAttribute('y', -size * 0.70);
                r.setAttribute('width', w); r.setAttribute('height', h);
                r.setAttribute('rx', 6);
                r.setAttribute('fill', 'rgba(255,217,61,0.10)');
                r.setAttribute('stroke', '#ffd93d');
                r.setAttribute('stroke-width', 2.5);
                r.setAttribute('stroke-dasharray', '8 6');
                if (tok.box && blankLevel !== undefined && blankLevel !== null) {
                    r.setAttribute('class', 'blank-box');
                    r.setAttribute('data-blank-level', blankLevel);
                    r.setAttribute('data-blank-idx', ctx.n);
                    r.setAttribute('pointer-events', 'all');
                }
                if (tok.box) ctx.n++;
                g.appendChild(r);
                cx += w + size * 0.22;
            } else if (tok.frac) {
                const gf = buildFrac(g, tok.frac[0], tok.frac[1], size, fill, blankLevel, ctx);
                gf.setAttribute('transform', 'translate(' + cx + ',0)');
                cx += gf.__w + size * 0.26;
            } else {
                const t = mkText(cx, 0, size, markupOf(tok), { fill: fill, anchor: 'start' });
                g.appendChild(t);
                cx += t.getComputedTextLength() + size * 0.1;
            }
        });
        return g;
    }
    // 统计 tokens 中虚线框数（含分式内，递归）
    function countBoxes(tokens) {
        let n = 0;
        (tokens || []).forEach(t => {
            if (t.box) n++;
            else if (t.frac) n += countBoxes(t.frac[0]) + countBoxes(t.frac[1]);
        });
        return n;
    }
    // 表达式放入指定中心点
    function placeExpr(parent, tokens, size, cx, cy, fill, blankLevel, startBoxN) {
        const g = buildExpr(parent, tokens, size, fill, blankLevel, startBoxN);
        const bb = g.getBBox();
        g.setAttribute('transform', 'translate(' + (cx - bb.x - bb.width / 2) + ',' + (cy - bb.y - bb.height / 2) + ')');
        return g;
    }
    // 放进指定中心点并在超宽时整体缩字（重排时虚线框编号回退）
    function fitExpr(parent, tokens, size, cx, cy, fill, blankLevel, startBoxN, maxW) {
        maxW = maxW || (LW - 40);
        const ctx = (startBoxN === undefined || startBoxN === null) ? null : { n: startBoxN };
        const mark = ctx ? ctx.n : 0;
        let g = placeExpr(parent, tokens, size, cx, cy, fill, blankLevel, ctx);
        const w = g.getBBox().width;
        if (w > maxW) {
            if (ctx) ctx.n = mark;
            g.remove();
            g = placeExpr(parent, tokens, size * maxW / w, cx, cy, fill, blankLevel, ctx);
        }
        return g;
    }

    function renderProgress() {

    // 本关已处理项数 / 总项数（状态行用，按关卡类型自动统计）
    function statusOf() {
        const i = S.level - 1, c = cur().cfg;
        if (c.kind === 'draw') {
            const d = S.draw[i], mids = moveIdsOf(c);
            return {
                done: c.targets.filter(t => d.found[t.id]).length + mids.filter(x => d.moved && d.moved[x]).length,
                total: c.targets.length + mids.length
            };
        }
        if (c.kind === 'order') return { done: S.order[i].next, total: c.steps.length };
        if (c.kind === 'qorder') return { done: S.qorder[i].done.length, total: qSpan(c, S.qorder[i].done) };
        if (c.kind === 'fw') return { done: S.fw[i].qs.filter(q => q.solved).length, total: S.fw[i].qs.length };
        if (c.kind === 'mix') return { done: S.mix[i].si, total: (S.mix[i].subs || c.subs).length };
        return { done: S.fill[i].filter(b => b.done).length, total: c.blanks.length };
    }

            const w0 = fb.getComputedTextLength();
            if (LX + w0 > RX - 6) {
                const k = Math.max(17, Math.floor(24 * (RX - 6 - LX) / w0));
                fb.setAttribute('font-size', k); sz = k;
                const w1 = fb.getComputedTextLength();
                if (LX + w1 > RX - 6) {
                    const max = Math.max(10, Math.floor((RX - 6 - LX) / sz));
                    if (text.length > max) { text = text.slice(0, max - 1) + '…'; fb.textContent = text; }
                }
            }
        } catch (e) {}
    }
    // 自适应行高：在 avail 内取尽量大的行高（避免留白过多 / 文字过小）
    function planRows(n, avail, hMax, hMin, gapRatio) {
        hMax = hMax || 62; hMin = hMin || 36;
        gapRatio = gapRatio === undefined ? 0.18 : gapRatio;
        for (let h = hMax; h >= hMin; h -= 2) {
            const gap = Math.round(h * gapRatio);
            if (n * h + (n - 1) * gap <= avail) return { h: h, gap: gap };
        }
        const gap = Math.max(4, Math.round(avail * 0.02));
        return { h: Math.max(26, Math.floor((avail - (n - 1) * gap) / n)), gap: gap };
    }

    // ---- 绘制关（①直流通路 ⑤交流微变等效：悬停菜单选「短路/断路」「置零/保留」） ----

    function fadeGroup(x, full) {

        g.style.opacity = (full || g.style.opacity === '0') ? '0' : '0.15';
        g.style.pointerEvents = 'none';

    //   第一次整理任一元件（RE2 移除 / RE1 保留 / R_C 下移）时调用：收起 V_s / R_B / C_E / R_L 四处
    //   接地符号与整理态 R_C 的接地符号，点亮 fx-gnd-rail；唯一保留 −V_EE 端子下方的 fx-vee。
    function ensureGndRail() {

        if (!d.ceGone) { showFx('fx-ce-tail', true); showFx('fx-tidy-ce', true); showFx('fx-tidy-vee', true); }

    // 执行一个绘制动作（id = 元件 data-id，act = 动作名）
    function execAct(id, act) {

            case 'cap-short':   // 电容短路：隐藏电容、画短接桥
                fadeGroup(id, true); showFx(CAP_FX[id], true); break;
            case 'cap-open': {  // 电容断路：本体与隔断回路一并淡出
                fadeGroup(id);
                const list = (c.fadeWith && c.fadeWith[id]) || [];
                list.forEach(x => fadeGroup(x));
                // 被移除回路里的特效件一并收起（C_B 断开输入回路时，Vs 的短接桥随之消失）
                if (list.indexOf('comp-src') >= 0) showFx('fx-vs', false);

                // 彻底移除清单（fadeWithFull）：节点圆与接地符号——断开后只剩两条导线，不再是节点，

                const full = (c.fadeWithFull && c.fadeWithFull[id]) || [];

            case 'vs-short': fadeGroup('comp-src', true); showFx('fx-vs', true); break;

                showFx('fx-ce', false);       // C_E 短接桥收起（接地作用已由 RE1 下方直连导线承担）

                showFx('fx-tidy-ce', false);  // 第93轮：C_E 支路补线随支路收起（否则 598 段悬空成残线）

                showFx('node-re', false);     // (486,470) 只剩「RE1 引线 + 直连导线」→ L 拐角，撤节点圆
                showFx('fx-re2-wire', true);  // RE1 下端 → −V_EE 端子(地) 的直连导线

    /* ★换案例：TQUIZ 等效问答——⚠️ 改 opts/ok 必须同步回归测试脚本答案表（DOM 文本无下划线 '↓ib'） */
    // ---- 晶体管等效五连问（第4关第3步）：

        const items = ops.map(op => ({ label: op, html: tquizOptHtml(op), fn: () => answerTQuiz(op) }));
        // 水平选项条固定在电路图上方空白带（等效态电路线 y=415 之上、已知行 y=217 之下；
        // 居中 cx=450 避开右上 +VCC 端子与接地符号区 795-851），不遮挡电路；顺序仍随机
        showMenu(null, items, true, { cx: 450, cy: 306 });   // 锁定菜单：不随鼠标离开消失
        render();
    }
    function answerTQuiz(op) {
        const d = S.draw[S.level - 1];
        if (!d || !d.tquiz || S.finished) return;
        const q = TQUIZ[d.tquiz.step];
        const right = op === q.ok;
        // 无论对错都推进：先停闪烁（隐藏该问红点）、呈现该问的正确等效结果
        // （B–E 画 r_be、C–E 画受控源、B–C 开路不画；i_b / i_c 画出正确方向的箭头）
        q.dots.forEach(id => showFx(id, false));
        setEPos(null);
        if (q.reveal) showFx(q.reveal, true);
        d.tquiz.step++;
        const last = d.tquiz.step >= TQUIZ.length;
        if (last) {
            if (!right && d.tquiz.pool > 0) d.tquiz.pool--;
            const got = d.tquiz.pool;   // 池语义：本项剩余分值（此前选错已扣除，可为 0）
            addScore(got);
            d.found['comp-t'] = true;
            fadeGroup('comp-t', true);
            const f = document.getElementById('fx-tmodel');
            if (f) f.style.pointerEvents = 'all';   // 模型完整可见后可点击（r_be 填空作答）
            hideMenu();
            if (right) {
                setMsg('正确，得 ' + got + ' 分。', '#34d399');
                say('回答正确，获得' + got + '分。');
            } else {
                setMsg('错误，本项得 ' + got + ' 分。', got > 0 ? '#ffd93d' : '#fb7185');
                say('回答错误，本项获得' + got + '分。');
            }
            render();
            if (drawDone(cur().cfg, d)) addT(completeLevel, 1200);
            return;
        }
        if (right) {
            setMsg('正确。', '#34d399');
            say('回答正确。');
        } else {
            if (d.tquiz.pool > 0) d.tquiz.pool--;
            if (d.tquiz.pool <= 0) {
                setMsg('错误，扣 1 分，本项已无分值。', '#fb7185');
                say('回答错误，扣1分，本项已经没分了。');
            } else {
                setMsg('错误，扣 1 分。', '#fb7185');
                say('回答错误，扣1分。');
            }
        }
        render();
        addT(() => showTQuizMenu(d), 900);
    }

    // ---- 小步（子步骤）判定：第 4 关「交流通路 → 整理电路 → 等效晶体管」 ----
    function moveIdsOf(c) {
        let out = [];
        (c.subSteps || []).forEach(st => { out = out.concat(st.moveIds || []); });
        return out;
    }
    function stepDone(c, d, st) {
        return (st.ids || []).every(x => d.found[x]) && (st.moveIds || []).every(x => d.moved && d.moved[x]);
    }
    function curStepIdx(c, d) {
        if (!c.subSteps) return 0;
        for (let i = 0; i < c.subSteps.length; i++) if (!stepDone(c, d, c.subSteps[i])) return i;
        return c.subSteps.length;
    }
    function targetAvailable(c, d, id) {
        if (c.gate && c.gate.indexOf(id) < 0) {   // 门控：gate 里的元件全部处理完，其它目标才解锁
            if (!c.gate.every(g => d.found[g])) return false;
        }
        if (!c.subSteps) return true;
        const st = c.subSteps[curStepIdx(c, d)];
        return !!(st && (st.ids || []).indexOf(id) >= 0);
    }
    function drawDone(c, d) {
        if (!c.targets.every(t => d.found[t.id])) return false;
        return (c.subSteps || []).every(st => stepDone(c, d, st));
    }
    function renderDraw() {
        const c = cur().cfg, d = S.draw[S.level - 1];
        const mids = moveIdsOf(c), per = Math.round(c.pts / c.targets.length);
        const total = c.targets.length + mids.length;
        const found = c.targets.filter(t => d.found[t.id]).length + mids.filter(x => d.moved && d.moved[x]).length;
        let qy = BODY_TOP + 36;
        if (c.subSteps) {
            const si = curStepIdx(c, d);
            const dots = c.subSteps.map((s, i) => (i < si ? '✓' : (i === si ? '▶' : '·')) + (i + 1)).join('  ');
            gameUI.appendChild(mkText(1010, BODY_TOP, 22, '当前步骤：' + (c.subSteps[si] ? c.subSteps[si].name : '完成') + '　' + dots, { fill: 'rgba(255,255,255,0.7)', bold: false }));
            qy = BODY_TOP + 38;
        }
        // 中文折行：优先在标点后断行（行首不出现标点、末行不剩单字），无处可断再按 17 字硬切
        const qmax = 17;
        const PUNCT = '，。、；：？！）」》';
        const qlines = [];
        let seg = c.q;
        while (seg.length > qmax) {
            let cut = qmax;
            for (let pi = Math.min(qmax, seg.length - 1) - 1; pi >= 5; pi--) {
                if (PUNCT.indexOf(seg[pi]) >= 0) { cut = pi + 1; break; }
            }
            qlines.push(seg.slice(0, cut));
            seg = seg.slice(cut);
        }
        if (seg) qlines.push(seg);
        qlines.forEach((line, qi) => {
            gameUI.appendChild(mkText(1010, qy + qi * 36, 26, line));
        });
        // 门控动态引导：电源未处理完时提示先处理电源
        let guide = '把鼠标移到电路图上，在浮出的菜单里选作答';
        if (c.gate && !c.gate.every(g => d.found[g])) guide = c.gateTodo || '当前：先处理信号源和电源';
        else if (c.gate) guide = c.gateDoneMsg || '信号源与电源已处理，现在处理三只电容';
        gameUI.appendChild(mkText(1010, qy + qlines.length * 36 + 16, 22, guide, { fill: 'rgba(255,255,255,0.7)', bold: false }));
        renderMsg(1010, 700, 26);
    }
    function buildMenuItems(id, menu) {
        return menu.map(o => ({
            label: o.label,
            fn: (anchor) => {
                if (o.sub) { showMenu(anchor, buildMenuItems(id, shuffle(o.sub))); return; }   // 置零 → 二级选项（短路/断路、接地/断路）随机顺序
                chooseDrawOption(id, o);
            }
        }));
    }
    function menuItemsFor(id) {
        if (S.finished) return null;
        const L = cur();
        if (!L || L.kind !== 'draw') return null;
        const c = L.cfg, d = S.draw[S.level - 1];
        if (!d || d.found[id]) return null;
        if (d.tquiz && d.tquiz.step < TQUIZ.length) return null;   // 等效问答进行中：不再弹晶体管菜单
        if (c.subSteps) {   // 整理下移目标：弹出「下移」，选后再弹「与 XX 串 / 并」二级选项
            const st = c.subSteps[curStepIdx(c, d)];
            if (st && (st.moveIds || []).indexOf(id) >= 0 && !(d.moved && d.moved[id])) {
                // ★换案例：下移后与谁并联（本案例 R_C 下移后与 R_L 并联）
                const pair = [['与RL串', false], ['与RL并', true]];
                return [{
                    label: '下移',
                    fn: (anchor) => {
                        showMenu(anchor, pair.map(p => ({
                            label: p[0],
                            fn: () => chooseMoveOption(id, p[1])
                        })));
                    }
                }];
            }
        }
        const t = (c.targets || []).find(x => x.id === id);
        if (!t || !t.menu || !targetAvailable(c, d, id)) return null;
        return buildMenuItems(id, t.menu);
    }
    // 下移后的串/并选择：正确 → 执行下挂；错误 → 直接扣 1 分可重选
    function chooseMoveOption(id, ok) {
        if (S.finished) return;
        if (ok) {
            const c = cur().cfg, d = S.draw[S.level - 1];
            hideMenu();
            moveCompDown(id);
            // R_B1 / R_C 下挂完成：播「回答正确。」，若三个电阻至此全部处理完则追加「请等效BJT。」
            saySeq(['回答正确。', nextHint(c, d, id)]);
            return;
        }
        const g = document.querySelector('g[data-id="' + id + '"]');
        if (g) blinkGroup(id, '#fb7185');
        penalize(1);
        setMsg('错误，扣 1 分。', '#fb7185');
        say('回答错误，扣1分。');
        render();
    }
    function chooseDrawOption(id, o) {
        if (S.finished) return;
        const c = cur().cfg, d = S.draw[S.level - 1];
        if (!d || d.found[id]) return;
        if (o.ok) {
            d.found[id] = true;
            if (o.act === 't-equiv') {   // 晶体管等效：分值全部由等效问答的分值池结算（此处不计分、不播报）
                execAct(id, o.act);      // 不 blinkGroup：晶体管本体已移除，若落到微变模型会把未作答的 r_be/βi_b 标签提前染色
                render();
                return;
            }
            if (d.pool[id] === undefined) d.pool[id] = Math.round(c.pts / c.targets.length);
            const got = d.pool[id];   // 答对只给该项剩余分值（此前选错已扣除，可为 0）
            addScore(got);
            execAct(id, o.act);
            blinkGroup(id, '#34d399');
            setMsg('正确，得 ' + got + ' 分。', '#34d399');
            // 「回答正确，得X分。」后按当前进度追加提示语（电源处理完→选电容；电容完→选电阻；电阻完→等效 BJT）
            saySeq(['回答正确，获得' + got + '分。', nextHint(c, d, id)]);
            // 晶体管「等效」不在此排定过关：五问全部结束后由 answerTQuiz 收尾（否则关卡在提问中被跳过）
            if (o.act !== 't-equiv' && drawDone(c, d)) { render(); addT(completeLevel, 1200); return; }
        } else {
            // 按项扣分：错一次该项分值池减 1（不立即动总分，答对时只给该项剩余分值——与 fw/fill/order 的池语义一致）
            if (d.pool[id] === undefined) d.pool[id] = Math.round(c.pts / c.targets.length);
            if (d.pool[id] > 0) d.pool[id]--;
            blinkGroup(id, '#fb7185');
            if (d.pool[id] <= 0) {
                setMsg('错误，扣 1 分，本项已无分值。', '#fb7185');
                say('回答错误，扣1分，本项已经没分了。');
            } else {
                setMsg('错误，扣 1 分。', '#fb7185');
                say('回答错误，扣1分。');
            }
        }
        render();
    }
    function pickDrawUnit(id) {
        if (S.finished) return;
        const c = cur().cfg, d = S.draw[S.level - 1];
        if (!d || d.found[id]) return;
        if (d.moved && d.moved[id]) return;   // 已下移的元件（下挂件同 data-id）不再重复处理
        if (c.subSteps) {   // 整理下移目标：点击本体弹出「下移 → 串/并」菜单（与悬停一致）
            const st = c.subSteps[curStepIdx(c, d)];
            if (st && (st.moveIds || []).indexOf(id) >= 0 && !(d.moved && d.moved[id])) {
                const gEl = document.querySelector('g[data-id="' + id + '"]');
                const items = menuItemsFor(id);
                if (items && gEl) showMenu(gEl, items);
                return;
            }
        }
        const t = (c.targets || []).find(x => x.id === id);
        if (t && t.menu && !targetAvailable(c, d, id)) {   // 门控未解锁：提示先处理电源，不扣分、不播语音
            setMsg(c.gateMsg || '请先处理信号源和电源，再处理电容。', '#ffd93d');
            render();
            return;
        }
        if (t && t.menu && targetAvailable(c, d, id)) return;   // 菜单目标：单击本体不作答，用浮出的菜单
        // 第 62 轮：点到非元件对象（导线/节点/装饰热区等）只是没点中答案，不扣分——消除「想点 BJT 等效却误击空白被扣分」
        if (id.indexOf('comp-') !== 0) {
            setMsg('请点击当前步骤要处理的元件。', '#ffd93d');
            render();
            return;
        }
        penalize(1);
        blinkGroup(id, '#fb7185');
        setMsg('错误，扣 1 分。', '#fb7185');
        say('回答错误，扣1分。');
        render();
    }

    // ---- 步骤排序关（②Q点计算步骤） ----
    function renderOrder() {
        const i = S.level - 1, c = cur().cfg, o = S.order[i];
        gameUI.appendChild(mkText(1010, BODY_TOP + 32, 26, c.q));
        const oqT = gameUI.lastChild;   // 题面超宽自动缩字
        if (oqT.getComputedTextLength() > 505) oqT.setAttribute('font-size', Math.max(20, Math.floor(26 * 505 / oqT.getComputedTextLength())));
        const oTop = BODY_TOP + 80, plan = planRows(S.orderList[i].length, BODY_BOT - oTop, 78, 48, 0.14);
        S.orderList[i].forEach((chip, vi) => {
            const y = oTop + vi * (plan.h + plan.gap);
            const done = o.next > chip.ord;
            const g = mkBtn(1010, y, 520, plan.h);
            if (done) g.classList.add('ok');
            else if (o.wrong === vi) g.classList.add('bad');
            gameUI.appendChild(g);
            if (done) {
                const bg = document.createElementNS(NS, 'g');
                const bc = document.createElementNS(NS, 'circle');
                bc.setAttribute('cx', 1036); bc.setAttribute('cy', y + plan.h / 2); bc.setAttribute('r', 15);
                bc.setAttribute('fill', '#34d399');
                bg.appendChild(bc);
                bg.appendChild(mkText(1036, y + plan.h / 2 + 8, 22, String(chip.ord + 1), { anchor: 'middle', fill: '#0a3d20' }));
                g.appendChild(bg);
            }
            const esz = Math.max(20, Math.min(30, Math.round(plan.h * 0.42)));
            let eg = placeExpr(g, chip.tokens, esz, done ? 1290 : 1270, y + plan.h / 2, done ? '#34d399' : '#ffffff');
            const ew = eg.getBBox().width;
            if (ew > 420) {
                eg.remove();
                placeExpr(g, chip.tokens, esz * 420 / ew, done ? 1290 : 1270, y + plan.h / 2, done ? '#34d399' : '#ffffff');
            }
            g.addEventListener('click', () => pickOrder(vi));
        });
        renderMsg(1010, 764, 26);
    }
    function pickOrder(vi) {
        if (S.finished) return;
        const i = S.level - 1, c = cur().cfg, o = S.order[i];
        const chip = S.orderList[i][vi];
        if (o.next > chip.ord) return;
        o.wrong = null;
        if (chip.ord === o.next) {
            o.next++;
            if (o.next >= c.steps.length) {
                addScore(o.rem);
                setMsg('正确，得 ' + Math.round(o.rem) + ' 分。', '#34d399');
                say('回答正确，获得' + Math.round(o.rem) + '分。', completeLevel);
            } else {
                setMsg('正确。', '#34d399');
                say('回答正确。');
            }
        } else {
            o.rem = Math.max(0, o.rem - 2);
            o.wrong = vi;
            if (o.rem === 0) {
                setMsg('错误，扣 2 分，本关已无分值。', '#fb7185');
                say('回答错误，扣2分，本关已经没分了。');
            } else {
                setMsg('错误，扣 2 分。', '#fb7185');
                say('回答错误，扣2分。');
            }
        }
        render();
    }

    // ---- Q点电量标注层（②按序点击；③框架+表达式关仍需参考/作答，故保留可见；进入交流关才移除） ----
    function updateQlabels() {
        const layer = document.getElementById('qlabel-layer');
        if (!layer) return;
        const L = cur();
        const k = L.kind;
        // 静态阶段（phase 0：Q点计算 mix）保留标注；动态阶段的 mix（第5关 Av/Ri/Ro）不显示——交流等效中 Q 点电量与箭头不应出现
        const on = k === 'qorder' || (k === 'mix' && L.phase === 0);
        // 第 63 轮：第 5 关（动态 mix）只保留 β 标注——Av 表达式中的 β 改为方框，由点它作答；
        //   其余 Q 点标注（V_BQ/I_CQ/…）在交流等效中不出现
        const dyn = k === 'mix' && L.phase === 1;
        layer.style.opacity = (on || dyn) ? '1' : '0';
        layer.style.pointerEvents = (on || dyn) ? 'all' : 'none';
        // 第64轮：关态必须给整层加 hit-off——子组内 rect.hot 被 `.interactive rect[fill="none"]{PE:all}`
        //   重新赋权，layer 上的 inline pointer-events:none 压不住（第4关实测：晶体管中心 (470,270)
        //   等处命中隐形 q-beta 热区，「等效」菜单不灵敏）。第5关 dyn 只保留 β 可点，其余子组同样断命中。
        layer.classList.toggle('hit-off', !(on || dyn));
        layer.querySelectorAll('g.interactive').forEach(g => {
            if (!dyn) { g.style.opacity = ''; g.style.pointerEvents = ''; g.classList.remove('hit-off'); return; }
            const isBeta = g.dataset.id === 'q-beta';
            g.style.opacity = isBeta ? '1' : '0';
            g.style.pointerEvents = isBeta ? '' : 'none';
            g.classList.toggle('hit-off', !isBeta);
        });
        // β 双位置：静态关（②③）原位（486,278：基极竖杆右侧三角区）；
        //   第 5 关起移到交流等效电路上方空白处、水平居中（x=450，与 TQUIZ 选项条同口径；
        //   基线 105，墨迹约 y78-113，位于等效电路（顶层 y=170）上方空白带，避开淡出的原顶轨 y=5 与 R_C 上端接线 x=486）
        const beta = layer.querySelector('g[data-id="q-beta"]');
        if (beta) {
            const tx = beta.querySelector('text'), hr = beta.querySelector('rect.hot');
            if (dyn) {
                tx.setAttribute('x', '450'); tx.setAttribute('y', '105');
                if (hr) { hr.setAttribute('x', '424'); hr.setAttribute('y', '71'); }
            } else {
                tx.setAttribute('x', '486'); tx.setAttribute('y', '278');
                if (hr) { hr.setAttribute('x', '460'); hr.setAttribute('y', '244'); }
            }
        }
    }
    function renderQorder() {

    function pickQorder(id) {
        if (S.finished) return;
        const i = S.level - 1, c = cur().cfg, o = S.qorder[i];
        if (!o || qAccept(c, o.done).length === 0) return;   // 已无后续可接受项 → 本关已完成
        if (o.done.indexOf(id) >= 0) {   // 已选过的量：不扣分
            setMsg('该量已选过。', '#ffd93d');
            render();
            return;
        }
        // 只认本关要计算的电量（各条合法路线里出现过的 id）；点到普通元件或已知参数（V_BE、β 等）只提示、不扣分
        const seqIds = qAllIds(c).concat(qAllIds(c).map(k2 => (c.alt || {})[k2]).filter(Boolean));
        if (seqIds.indexOf(id) < 0) {
            setMsg('请点击本关要计算的电量。', '#ffd93d');
            render();
            return;
        }
        const acc = qAccept(c, o.done);   // 多条合法顺序取并集
        if (acc.indexOf(id) >= 0) {
            if (o.done.length === 0) S.route = qRouteOf(c, id);   // 首步定路线（供第 3 关选择 subs / subsC / subsBase）
            o.done.push(id);
            o.next++;
            S.qPicked = o.done.slice();   // 第76轮：记录实际点击序列，第 3 关据此决定 I_BQ 与 V_CEQ 两块的先后
            blinkGroup(id, '#34d399');
            if (qAccept(c, o.done).length === 0) {   // 已达某条合法路线的末尾 → 本关完成
                addScore(Math.round(o.rem));
                setMsg('步骤全对，得 ' + Math.round(o.rem) + ' 分。', '#34d399');
                say('回答正确，获得' + Math.round(o.rem) + '分。', completeLevel);
            } else {
                setMsg('正确。', '#34d399');
                say('回答正确。');
            }
        } else {
            o.rem = Math.max(0, o.rem - 2);
            blinkGroup(id, '#fb7185');
            if (o.rem === 0) {
                setMsg('错误，扣 2 分，本关已无分值。', '#fb7185');
                say('回答错误，扣2分，本关已经没分了。');
            } else {
                setMsg('错误，扣 2 分。', '#fb7185');
                say('回答错误，扣2分。');
            }
        }
        render();
    }

    // ---- 选框架关（③⑥；支持多子问：⑥连续选 Av/Ri/Ro 三个指标的框架） ----
    function renderFw() {
        const i = S.level - 1, c = cur().cfg, fw = S.fw[i];
        const multi = fw.qs.length > 1;
        const q = fw.qs[fw.qi];
        let qy = BODY_TOP;
        if (multi) {   // 指标进度：①②③（已答✓ / 当前▶ / 未答·）
            const dots = fw.qs.map((qq, qi) => (qq.solved ? '✓' : (qi === fw.qi ? '▶' : '·')) + (qi + 1)).join('  ');
            gameUI.appendChild(mkText(1010, qy, 22, '当前指标：' + q.label + '　' + dots, { fill: 'rgba(255,255,255,0.7)', bold: false }));
            qy += 40;
        }
        gameUI.appendChild(mkText(1010, qy + 30, 26, q.fwQ));
        const oy0 = qy + 78, plan = planRows(q.opts.length, BODY_BOT - oy0, multi ? 80 : 96, 48, 0.14);
        q.opts.forEach((f, vi) => {
            const y = oy0 + vi * (plan.h + plan.gap);
            const g = mkBtn(1010, y, 520, plan.h);
            const col = (f.correct && q.solved) ? '#34d399' : '#ffffff';
            if (q.solved) { if (f.correct) g.classList.add('ok'); else g.classList.add('dim'); }
            else if (q.chosen.indexOf(vi) >= 0) { g.classList.add('bad'); g.classList.add('dim'); }
            g.dataset.optIdx = vi;
            gameUI.appendChild(g);
            g.appendChild(mkText(1028, y + plan.h / 2 + 10, 25, String.fromCharCode(65 + vi), { fill: 'rgba(255,255,255,0.55)' }));
            const fsz = Math.max(20, Math.min(32, Math.round(plan.h * 0.40)));
            let eg = placeExpr(g, f.tokens, fsz, 1290, y + plan.h / 2, col);
            const ew = eg.getBBox().width;
            if (ew > 420) {
                eg.remove();
                placeExpr(g, f.tokens, fsz * 420 / ew, 1290, y + plan.h / 2, col);
            }
            g.addEventListener('click', () => pickFw(vi));
        });
        renderMsg(1010, 764, 26);
    }
    function pickFw(vi) {
        if (S.finished) return;
        const i = S.level - 1, c = cur().cfg, fw = S.fw[i];
        const q = fw.qs[fw.qi];
        if (q.solved || q.chosen.indexOf(vi) >= 0) return;
        q.chosen.push(vi);
        if (q.opts[vi].correct) {
            q.solved = true;
            addScore(Math.round(q.rem));
            setMsg('正确，得 ' + Math.round(q.rem) + ' 分。', '#34d399');
            if (fw.qi >= fw.qs.length - 1) {
                fw.solved = true;
                say('回答正确，获得' + Math.round(q.rem) + '分。', completeLevel);
            } else {
                say('回答正确，获得' + Math.round(q.rem) + '分。', () => {
                    fw.qi++;
                    render();
                });
            }
        } else {
            q.rem = Math.max(0, q.rem - q.pen);
            if (q.rem === 0) {
                setMsg('错误，扣 ' + q.pen + ' 分，本项已无分值。', '#fb7185');
                say('回答错误，扣' + q.pen + '分，本项已经没分了。');
            } else {
                setMsg('错误，扣 ' + q.pen + ' 分。', '#fb7185');
                say('回答错误，扣' + q.pen + '分。');
            }
        }
        render();
    }

    // ---- 填表达式关（④⑦） ----
    // ---- 框架 + 表达式交错关（③：每个电量先选框架、再填表达式） ----
    function renderMix() {
        const i = S.level - 1, c = cur().cfg, mx = S.mix[i];
        const sb = mx.subs[mx.si], st = mx.steps[mx.si];
        // 子步 >6 时省略序号（第69轮）：8 子步带序号会超出面板宽度，仅保留 ✓/▶/· 状态点
        const dots = mx.subs.map((s2, k) => (k < mx.si ? '✓' : (k === mx.si ? '▶' : '·')) + (mx.subs.length <= 6 ? (k + 1) : '')).join(' ');
        gameUI.appendChild(mkText(1010, BODY_TOP, 22, '第 ' + (mx.si + 1) + ' / ' + mx.subs.length + ' 步 · ' + sb.name + '　' + dots, { fill: 'rgba(255,255,255,0.7)', bold: false }));
        if (st.type === 'fw') {
            // 静态：第2/3关整图不再变紫；改为闪烁「当前要选框架的那个电量」作定位提示（每次子步只闪一次）
            if (S.mixQ[i] !== mx.si) {
                S.mixQ[i] = mx.si;
                if (cur().phase === 0) {
                    const qid = fwBlinkQId(cur(), mx.si);
                    if (qid) blinkGroup(qid, '#ff5252');
                }
            }
            gameUI.appendChild(mkText(1010, BODY_TOP + 40, 26, sb.fwQ));
            const oy0 = BODY_TOP + 88, plan = planRows(st.opts.length, BODY_BOT - oy0, 96, 48, 0.14);
            st.opts.forEach((f, vi) => {
                const y = oy0 + vi * (plan.h + plan.gap);
                const g = mkBtn(1010, y, 520, plan.h);
                const col = (f.correct && st.solved) ? '#34d399' : '#ffffff';
                if (st.solved) { if (f.correct) g.classList.add('ok'); else g.classList.add('dim'); }
                else if (st.chosen.indexOf(vi) >= 0) { g.classList.add('bad'); g.classList.add('dim'); }
                g.dataset.optIdx = vi;
                gameUI.appendChild(g);
                g.appendChild(mkText(1028, y + plan.h / 2 + 10, 25, String.fromCharCode(65 + vi), { fill: 'rgba(255,255,255,0.55)' }));
                const fsz = Math.max(20, Math.min(32, Math.round(plan.h * 0.40)));
                let eg = placeExpr(g, f.tokens, fsz, 1290, y + plan.h / 2, col);
                const bb0 = eg.getBBox(), ew = bb0.width, eh = bb0.height;
                // 超宽或超高（嵌套分式）时整体缩字（第67轮加高度维度）
                if (ew > 420 || eh > plan.h - 10) { const sc = Math.min(420 / ew, (plan.h - 10) / eh); eg.remove(); placeExpr(g, f.tokens, fsz * sc, 1290, y + plan.h / 2, col); }
                g.addEventListener('click', () => pickMixFw(vi));
            });
            renderMsg(1010, 764, 26);
            return;
        }
        gameUI.appendChild(mkText(1010, BODY_TOP + 40, 26, '表达式：', { fill: '#ffd93d' }));
        const es = 42;   // 文字标准（lin-g 系列）：填空表达式 42，超宽自动缩排
        const eTop = BODY_TOP + 96, eSpan = BODY_BOT - eTop;
        const eStep = Math.min(120, eSpan / Math.max(1, sb.fullExpr.length));
        const eY0 = eTop + (eSpan - (sb.fullExpr.length - 1) * eStep) / 2;
        let boxOff = 0;
        sb.fullExpr.forEach((toks, li) => {
            fitExpr(gameUI, toks, es, 1260, eY0 + li * eStep, '#ffffff', i, boxOff, 470);
            boxOff += countBoxes(toks);
        });
        st.blanks.forEach((b, bi) => {   // 已填好的空：绿字回填
            if (!b.done) return;
            const r = gameUI.querySelector('.blank-box[data-blank-level="' + i + '"][data-blank-idx="' + bi + '"]');
            if (!r) return;
            r.classList.add('done');
            const bx = parseFloat(r.getAttribute('x')) + parseFloat(r.getAttribute('width')) / 2;
            const by = parseFloat(r.getAttribute('y')) + parseFloat(r.getAttribute('height')) / 2;
            const g2 = buildExpr(r.parentNode, (b.labels && b.picked && b.labels[b.picked]) || b.label, 27, '#34d399');
            const bb2 = g2.getBBox();
            g2.setAttribute('transform', 'translate(' + (bx - bb2.x - bb2.width / 2) + ',' + (by - bb2.y - bb2.height / 2) + ')');
        });
        if (S.selBox && S.selBox.level === i && S.selBox.mix === mx.si) {
            const r = gameUI.querySelector('.blank-box[data-blank-level="' + i + '"][data-blank-idx="' + S.selBox.idx + '"]');
            if (r) r.classList.add('sel');
        }
        renderMsg(1010, 752, 26);
    }
    function pickMixFw(vi) {
        if (S.finished) return;
        const i = S.level - 1, mx = S.mix[i];
        const st = mx && mx.steps[mx.si];
        if (!st || st.type !== 'fw' || st.solved || st.chosen.indexOf(vi) >= 0) return;
        st.chosen.push(vi);
        if (st.opts[vi].correct) {
            st.solved = true;
            addScore(Math.round(st.rem));
            setMsg('正确，得 ' + Math.round(st.rem) + ' 分。', '#34d399');
            if (mx.si >= mx.steps.length - 1) {
                say('回答正确，获得' + Math.round(st.rem) + '分。', completeLevel);
            } else {
                say('回答正确，获得' + Math.round(st.rem) + '分。', () => {
                    mx.si++;
                    S.selBox = null;
                    render();
                    // 第69轮：进入带 say 的子步时播报（第76轮改读当前路线子步）
                    const sb2 = mx.subs[mx.si];
                    if (sb2 && sb2.say) say(sb2.say);
                });
            }
        } else {
            st.rem = Math.max(0, st.rem - st.pen);
            if (st.rem === 0) {
                setMsg('错误，扣 ' + st.pen + ' 分，本项已无分值。', '#fb7185');
                say('回答错误，扣' + st.pen + '分，本项已经没分了。');
            } else {
                setMsg('错误，扣 ' + st.pen + ' 分。', '#fb7185');
                say('回答错误，扣' + st.pen + '分。');
            }
        }
        render();
    }
    // mix 关填空：选中态的推进（本子步填满后延时进入下一步）
    function mixFillDone(i) {
        const mx = S.mix[i];
        if (mx.si >= mx.steps.length - 1) { completeLevel(); return; }
        mx.si++; S.selBox = null; render();
        // 第69轮：进入带 say 的子步（如「工程近似估算法简化」）时播报其提示语；第76轮改读当前路线子步
        const sb = mx.subs[mx.si];
        if (sb && sb.say) say(sb.say);
    }

    function renderFill() {
        const i = S.level - 1, c = cur().cfg;
        const blankPts = c.pts / c.blanks.length;
        gameUI.appendChild(mkText(1010, BODY_TOP + 34, 26, cur().phaseName + '表达式：', { fill: '#ffd93d' }));
        const lines = c.fullExpr;
        const es = c.exprSize || 42;   // 文字标准（lin-g 系列）：填空表达式 42，超宽自动缩排
        const baseY = BODY_TOP + 96, eSpan = BODY_BOT - baseY;
        const rowStep = Math.min(120, eSpan / Math.max(1, lines.length));
        const rowY0 = baseY + (eSpan - (lines.length - 1) * rowStep) / 2;
        let boxOff = 0;
        lines.forEach((toks, li) => {
            fitExpr(gameUI, toks, es, 1260, rowY0 + li * rowStep, '#ffffff', i, boxOff, 470);
            boxOff += countBoxes(toks);
        });
        // 已填好的空：绿色实线 + 内容
        S.fill[i].forEach((b, bi) => {
            if (!b.done) return;
            const r = gameUI.querySelector('.blank-box[data-blank-level="' + i + '"][data-blank-idx="' + bi + '"]');
            if (!r) return;
            r.classList.add('done');
            const bx = parseFloat(r.getAttribute('x')) + parseFloat(r.getAttribute('width')) / 2;
            const by = parseFloat(r.getAttribute('y')) + parseFloat(r.getAttribute('height')) / 2;
            const g2 = buildExpr(r.parentNode, c.blanks[bi].label, 27, '#34d399');
            const bb2 = g2.getBBox();
            g2.setAttribute('transform', 'translate(' + (bx - bb2.x - bb2.width / 2) + ',' + (by - bb2.y - bb2.height / 2) + ')');
        });
        // 选中态
        if (S.selBox && S.selBox.level === i) {
            const r = gameUI.querySelector('.blank-box[data-blank-level="' + i + '"][data-blank-idx="' + S.selBox.idx + '"]');
            if (r) r.classList.add('sel');
        }
        renderMsg(1010, 768, 26);
    }
    // 虚线框点选（面板内事件委托；fill 关与 mix 关的填空子步都走这里）
    gameUI.addEventListener('click', e => {
        const r = e.target.closest ? e.target.closest('.blank-box') : null;
        if (!r || r.classList.contains('done') || S.finished) return;
        const k = cur().kind;
        if (k !== 'fill' && k !== 'mix') return;
        const lv = parseInt(r.getAttribute('data-blank-level'), 10);
        const idx = parseInt(r.getAttribute('data-blank-idx'), 10);
        if (k === 'mix') {
            const mx = S.mix[lv];
            if (mx.steps[mx.si].type !== 'fill') return;
            S.selBox = { level: lv, mix: mx.si, idx: idx };
        } else {
            S.selBox = { level: lv, idx: idx };
        }
        render();
    });
    // 电路元件作答：绘制关 → pickDrawUnit；填表达式关 → 与选中空的 ansIds 比对
    document.querySelector('.stage').addEventListener('click', e => {
        if (S.finished) return;
        const gEl = e.target.closest ? e.target.closest('g.interactive') : null;
        if (!gEl || !gEl.dataset.id) return;
        const id = gEl.dataset.id === 'comp-t-model' ? 'comp-t' : gEl.dataset.id;   // 微变模型等效晶体管
        const k = cur().kind;
        if (k === 'draw') pickDrawUnit(id);
        else if (k === 'qorder') pickQorder(id);
        else if (k === 'fill' && S.selBox) answerBlank(id);
        else if (k === 'mix' && S.selBox && S.selBox.mix !== undefined) answerBlank(id);
    });
    function answerBlank(id) {
        const i = S.selBox.level, bi = S.selBox.idx;
        const c = LEVELS[i].cfg;
        const isMix = S.selBox.mix !== undefined;
        const st = isMix ? S.mix[i].steps[S.selBox.mix] : null;
        const b = isMix ? st.blanks[bi] : S.fill[i][bi];
        const spec = isMix ? b : c.blanks[bi];
        const full = isMix ? b.full : c.pts / c.blanks.length;
        if (b.done) return;
        // 同一组（grp）内的空不能填同一个量：如 V_BQ 分母 RB1+RB2 可交换顺序，但不能 RB1+RB1
        // 注意：不同组不加限制（R_B2 在分子与分母中各出现一次，属正常）
        const sibs = isMix ? st.blanks : S.fill[i];
        const dup = !!spec.grp && sibs.some((x, xi) => xi !== bi && x.done && x.grp === spec.grp && x.picked === id);
        if (!dup && spec.ansIds.indexOf(id) >= 0) {
            b.done = true;
            b.picked = id;
            addScore(Math.round(b.rem));
            blinkGroup(id, '#34d399');
            setMsg('正确，得 ' + Math.round(b.rem) + ' 分。', '#34d399');
            say('回答正确，获得' + Math.round(b.rem) + '分。');
            S.selBox = null;
            const allDone = isMix ? st.blanks.every(x => x.done) : S.fill[i].every(x => x.done);
            if (allDone) {
                if (isMix) addT(() => mixFillDone(i), 1600);   // 本子步填满 → 进入该量的下一步
                else addT(completeLevel, 2000);
            }
            render();
        } else {
            const half = Math.round(full / 2);
            b.rem = Math.max(0, b.rem - half);
            blinkGroup(id, '#fb7185');
            if (b.rem === 0) {
                setMsg('错误，扣 ' + half + ' 分，本项已无分值。', '#fb7185');
                say('回答错误，扣' + half + '分，本项已经没分了。');
            } else {
                setMsg('错误，扣 ' + half + ' 分。', '#fb7185');
                say('回答错误，扣' + half + '分。');
            }
            render();
        }
    }

    // ---- 关卡推进 / 完成结算 ----
    function completeLevel() {
        if (S.finished) return;
        const prev = cur();
        if (S.level >= LEVELS.length) { finish(); return; }
        S.level++;
        S.levelStart = S.score;
        S.selBox = null;
        // 直流通路视图保留给静态后续关卡；进入动态阶段的绘制关（交流等效）前恢复完整电路
        if (cur().cfg.kind === 'draw' && cur().cfg.mode === 'transform') resetCircuit();
        if (cur().cfg.kind === 'mix') arrangeMixSubs(S.level - 1);   // 子步顺序跟随第 2 关点选顺序
        render();
        announceLevel(highlightFor(cur()));
    }
    function finish() {
        S.finished = true; S.selBox = null;
        clearStageHighlight();
        say('恭喜你，完成全部关卡！最终得分' + S.score + '分。');
        render();
    }
    function renderDone() {
        gameUI.appendChild(mkText(1260, 342, 42, '🎉 闯关完成！', { anchor: 'middle', fill: '#ffd93d' }));
        gameUI.appendChild(mkText(1260, 428, 48, '最终得分：' + S.score + ' / 100', { anchor: 'middle', fill: '#ffd93d' }));
        LEVELS.forEach((L, i) => {
            gameUI.appendChild(mkText(1260, 476 + i * 30, 25,
                (i + 1) + '. ' + L.cfg.short + '（' + L.phaseName + '）：' + Math.round(S.levelScore[i]) + ' 分',
                { anchor: 'middle', fill: 'rgba(255,255,255,0.85)', bold: false }));
        });
        // ★ 面板内宽约 520px、26px 中文字宽≈26px/字，单行上限约 19 字，超出会被面板右缘裁切
        const ev = S.score >= 90 ? '优秀！双电源共射静动态掌握扎实。'
                 : S.score >= 75 ? '良好！再巩固一下表达式框架就更棒了。'
                 : S.score >= 60 ? '及格。建议回看分段旁路再练一遍。'
                 : '别灰心，点击"重新挑战"再闯一次！';
        gameUI.appendChild(mkText(1260, 694, 26, ev, { anchor: 'middle', fill: '#34d399' }));
        const g = mkBtn(1150, 718, 220, 58, 'g-btn');
        g.appendChild(mkText(1260, 755, 29, '重新挑战', { anchor: 'middle' }));
        g.addEventListener('click', restart);
        gameUI.appendChild(g);
    }
    function restart() {
        calcTimers.forEach(clearTimeout); calcTimers = [];
        stopSpeak();
        resetCircuit();
        initState();
        render();
        addT(() => announceLevel(highlightFor(cur())), 300);
    }

    // ---- 总渲染入口 ----
    function render() {
        clearUI();
        updateQlabels();
        renderHeader();
        renderProgress();
        if (S.finished) { renderDone(); return; }
        renderSubLine();
        const k = cur().kind;
        if (k === 'draw') renderDraw();
        else if (k === 'order') renderOrder();
        else if (k === 'qorder') renderQorder();
        else if (k === 'fw') renderFw();
        else if (k === 'mix') renderMix();
        else renderFill();
    }
    initState();
    LEVELS.forEach((L2, i) => arrangeMixSubs(i));   // 初始默认序（第 2 关未作答时保持配置原序）
    render();
    // 进入第 1 关：语音播完才触发（稍延迟给 TTS 就绪留时间）
    addT(() => announceLevel(highlightFor(cur())), 400);
    // 测试钩子：自动化自检读取内部状态（只读）
    function getState() { return S; }
    function getLevels() { return LEVELS; }
    // 调试预览（自查/截图用）：?lvl=1..6 / ?lvl=done
    (function () {
        const m = location.search.match(/[?&]lvl=(\w+)/);
        if (!m) return;
        const v = m[1];
        if (v === 'done') { S.finished = true; render(); return; }
        const n = parseInt(v, 10);
        if (!(n >= 1 && n <= LEVELS.length)) return;
        S.level = n;
        // 路线预览：?lvl=3&rt=eq|cq|base 直接看第 3 关的对应方案（eq 先算 I_EQ / cq 先算 I_CQ / base 基极优先）
        //   emitter 为第65轮旧路线名，等价于 eq（兼容旧链接）
        const mr = location.search.match(/[?&]rt=(base|emitter|eq|cq)/);
        if (mr) { S.route = (mr[1] === 'emitter') ? 'eq' : mr[1]; if (S.mix[n - 1]) arrangeMixSubs(n - 1); }
        // 多子问框架关预览：?lvl=5&fq=2 直接看第 2 个指标
        const mq = location.search.match(/[?&]fq=(\d+)/);
        if (mq) {
            const fwi = S.fw[n - 1];
            if (fwi) {
                const tgt = Math.min(Math.max(1, parseInt(mq[1], 10)), fwi.qs.length) - 1;
                for (let k = 0; k < tgt; k++) fwi.qs[k].solved = true;
                fwi.qi = tgt;
            }
        }
        // 交错关子步预览：?lvl=3&ms=6 直接看第 6 个子步（前面子步视为已完成）
        const mm = location.search.match(/[?&]ms=(\d+)/);
        if (mm) {
            const mxi = S.mix[n - 1];
            if (mxi) {
                const tgt = Math.min(Math.max(1, parseInt(mm[1], 10)), mxi.steps.length) - 1;
                for (let k = 0; k < tgt; k++) {
                    const st = mxi.steps[k];
                    if (st.type === 'fw') st.solved = true;
                    else st.blanks.forEach(b => { b.done = true; });
                }
                mxi.si = tgt;
            }
        }
        // 第 4 关状态预览：?lvl=4&tidy=1 整理+等效布局；&ts=n 再看第 n 问（1..5=各问，6=全部完成态）
        const mt = location.search.match(/[?&]ts=(\d+)/);
        const mty = location.search.match(/[?&]tidy=(\d+)/);
        if ((mt || mty) && n === 4) {
            const d4 = S.draw[3];
            // 先摆出整理+等效态（电源置零、电容短路、RE 移除变导线、RB1/RC 下挂）
            execAct('comp-vcc', 'vcc-gnd'); d4.found['comp-vcc'] = true;
            execAct('comp-vee', 'vee-gnd'); d4.found['comp-vee'] = true;
            execAct('comp-c1', 'cap-short'); d4.found['comp-c1'] = true;
            execAct('comp-c2', 'cap-short'); d4.found['comp-c2'] = true;
            execAct('comp-ce', 'cap-short'); d4.found['comp-ce'] = true;
            execAct('comp-src', 'vs-keep'); d4.found['comp-src'] = true;
            execAct('comp-re2', 're2-remove'); d4.found['comp-re2'] = true;
            execAct('comp-re1', 're1-keep'); d4.found['comp-re1'] = true;
            moveCompDown('comp-rc');
            if (mt) {
                const tv = parseInt(mt[1], 10);
                const last = TQUIZ.length;   // 5 问
                showEquiv();
                fadeGroup('comp-t', true);
                showFx('fx-tmodel', true);
                const done = tv > last;
                d4.tquiz = { step: done ? last : tv - 1, pool: 2 };
                // 已作答的前 tv-1 问：逐问画出其正确结果
                TQUIZ.slice(0, done ? last : tv - 1).forEach(q => { if (q.reveal) showFx(q.reveal, true); });
                if (done) {
                    d4.found['comp-t'] = true;
                    const f = document.getElementById('fx-tmodel');
                    if (f) f.style.pointerEvents = 'all';
                } else {
                    showTQuizMenu(d4);
                }
            }
        }
        render();
        // 调试预览不播音：直接高亮对应级
        addT(() => { const hl = highlightFor(cur()); if (hl) hl(); }, 320);
    })();

    /* ==== cj-g3 引擎补丁（勿手改，由 _patch_g3.py 生成） ==== */

    // ===== 事件绑定（框架通用，勿改） =====
    // 游戏页：不挂悬停注解/语音（防止直接提示答案），仅保留点击闪烁反馈
    document.querySelectorAll('.interactive').forEach(el => {
        el.addEventListener('click', () => {
            el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
        });
    });
    // 悬停菜单：绘制关中可作答的元件浮出选择菜单（短路/断路、置零/保留、下移 …）
    document.querySelectorAll('.interactive').forEach(el => {
        el.addEventListener('mouseenter', () => {
            const items = menuItemsFor(el.dataset.id);
            if (items && items.length) { clearTimeout(menuTimer); showMenu(el, items); }

    });

    // 关闭：通知父页面移除弹窗（也可独立打开时用 window.close）
    function requestClose() {
        stopSpeak();
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'close-circuit-lab' }, '*');
