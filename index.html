<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟电子技术 - 交互式学习平台</title>
    <link rel="stylesheet" href="css/style.css?v=3.13">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-icon">模</div>
                <div class="logo-text">
                    <h1>模拟电子技术</h1>
                    <p>ANALOG ELECTRONIC TECHNOLOGY</p>
                </div>
            </div>
        </div>

        <div class="header-center">
            <div class="module-tabs">
                <button class="module-tab active" data-module="learning">
                    <span class="icon">📚</span>
                    <span>学习资源</span>
                </button>
                <button class="module-tab" data-module="training">
                    <span class="icon">✏️</span>
                    <span>训练资源</span>
                </button>
                <button class="module-tab" data-module="testing">
                    <span class="icon">📝</span>
                    <span>测试资源</span>
                </button>
            </div>
        </div>

        <div class="header-right">
            <div class="view-toggle">
                <button class="view-btn active" data-view="chapter">
                    <span>📖</span>
                    <span>课程导航</span>
                </button>
                <button class="view-btn" data-view="graph">
                    <span>🕸️</span>
                    <span>知识图谱</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">课程目录</span>
                <div class="sidebar-actions">
                    <button class="icon-btn" title="展开全部" onclick="expandAllChapters()">⊕</button>
                    <button class="icon-btn" title="收起全部" onclick="collapseAllChapters()">⊖</button>
                </div>
            </div>

            <!-- 筛选面板 -->
            <div class="filter-panel">
                <div class="filter-group">
                    <span class="filter-label">问题类型</span>
                    <div class="filter-options" id="typeFilters"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-label">教学目标</span>
                    <div class="filter-options" id="objectiveFilters"></div>
                </div>
            </div>

            <!-- 章节树 -->
            <div class="chapter-tree" id="chapterTree"></div>
        </aside>

        <!-- 主内容区 -->
        <main class="content-area">
            <div class="content-header">
                <div class="breadcrumb" id="breadcrumb">
                    <span class="breadcrumb-item">首页</span>
                </div>
                <div class="content-actions">
                    <button class="btn" onclick="toggleSidebar()">
                        <span>☰</span>
                    </button>
                </div>
            </div>
            <div class="content-body" id="contentBody"></div>
        </main>
    </div>

    <!-- 脚本 -->
    <script src="js/data.js?v=3.19"></script>
    <script src="js/app.js?v=3.14"></script>
    <script>
        // 展开所有章节
        function expandAllChapters() {
            courseData.chapters.forEach(chapter => {
                const chapterEl = document.querySelector(`.chapter-item[data-chapter-id="${chapter.id}"]`);
                if (chapterEl) {
                    chapterEl.classList.add('expanded');
                    appState.expandedChapters.add(chapter.id);
                }
            });
        }

        // 收起所有章节
        function collapseAllChapters() {
            courseData.chapters.forEach(chapter => {
                const chapterEl = document.querySelector(`.chapter-item[data-chapter-id="${chapter.id}"]`);
                if (chapterEl) {
                    chapterEl.classList.remove('expanded');
                    appState.expandedChapters.delete(chapter.id);
                }
            });
        }
    </script>
</body>
</html>
